<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="760" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Cruzar el metro de baldosa entre la pared y el césped</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Opciones de mejor a peor (06/10/2026) y lo que se decidió el 07/10</text><rect x="40" y="115" width="1320" height="92" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><circle cx="84" cy="161" r="24" fill="#2f855a" stroke="#2f855a" stroke-width="2"/><text class="f" x="84" y="169" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text class="f" x="126" y="147" font-size="19" font-weight="700" fill="#2f855a">La zanja sigue por debajo del porche</text><rect x="1230" y="129" width="60" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1260.0" y="147.0" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Mejor</text><text class="f" x="126" y="173" font-size="15" fill="#1f2933">Se levanta una fila de baldosas (≈ 1 m), se mete el corrugado Ø50 y se vuelven a pegar con cemento cola.</text><text class="f" x="126" y="195" font-size="15" fill="#5f6b7a">En el suelo no queda nada. Preguntar si hay baldosas de repuesto. Si lo haces tú: ≈ +100 €, 2-3 h.</text><rect x="40" y="219" width="1320" height="92" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="84" cy="265" r="24" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="84" y="273" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text class="f" x="126" y="251" font-size="19" font-weight="700" fill="#2563eb">Roza en el suelo</text><rect x="1230" y="233" width="84" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1272.0" y="251.0" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Con obra</text><text class="f" x="126" y="277" font-size="15" fill="#1f2933">Dos cortes por la junta (radial de 125 mm, disco de diamante), picar con el SDS en modo cincel, 1-2 cm de mortero y rejuntar.</text><text class="f" x="126" y="299" font-size="15" fill="#5f6b7a">Queda una cicatriz gris y la baldosa se puede agrietar. ≈ +100 €.</text><rect x="40" y="323" width="1320" height="92" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><circle cx="84" cy="369" r="24" fill="#a16207" stroke="#a16207" stroke-width="2"/><text class="f" x="84" y="377" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text class="f" x="126" y="355" font-size="19" font-weight="700" fill="#a16207">Tubo grapado al suelo, pegado a la valla</text><rect x="1230" y="337" width="68" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1264.0" y="355.0" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">Rápido</text><text class="f" x="126" y="381" font-size="15" fill="#1f2933">Detrás de los cubos, donde no se pisa (plan del 05/10). Tubo rígido LH, bien pegado a la base de la valla.</text><text class="f" x="126" y="403" font-size="15" fill="#5f6b7a">Lo más rápido, pero el tubo va en el suelo: se puede tropezar y queda feo.</text><rect x="40" y="427" width="1320" height="92" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><circle cx="84" cy="473" r="24" fill="#d1342f" stroke="#d1342f" stroke-width="2"/><text class="f" x="84" y="481" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text class="f" x="126" y="459" font-size="19" font-weight="700" fill="#d1342f">Canaleta o pasacables de suelo</text><rect x="1230" y="441" width="36" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1248.0" y="459.0" font-size="14" font-weight="700" fill="#d1342f" text-anchor="middle">No</text><text class="f" x="126" y="485" font-size="15" fill="#1f2933">No es estanca, el sol y los golpes la rompen y se tropieza.</text><text class="f" x="126" y="507" font-size="15" fill="#5f6b7a">Solo para algo provisional.</text><rect x="40" y="531" width="1320" height="92" rx="10" fill="#f1ebfd" stroke="#6b46c1" stroke-width="2"/><circle cx="84" cy="577" r="24" fill="#6b46c1" stroke="#6b46c1" stroke-width="2"/><text class="f" x="84" y="585" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text class="f" x="126" y="563" font-size="19" font-weight="700" fill="#6b46c1">Todo por la pared</text><rect x="1230" y="545" width="68" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1264.0" y="563.0" font-size="14" font-weight="700" fill="#6b46c1" text-anchor="middle">Plan B</text><text class="f" x="126" y="589" font-size="15" fill="#1f2933">Hasta un punto donde el césped toque la casa sin baldosa, y bajar directo a la zanja.</text><rect x="40" y="641" width="1320" height="110" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="2"/><text class="f" x="60" y="675" font-size="19" font-weight="700" fill="#1f2933">Lo que se decidió (07/10/2026, 18:57)</text><text class="f" x="60" y="703" font-size="15" fill="#1f2933">Frederic no quiere tocar el césped artificial: tubo grapado por la pared hasta el escalón (≈ 15 cm), caja de paso IP65</text><text class="f" x="60" y="727" font-size="15" fill="#1f2933">en la cara del escalón y zanja de 10 m en el césped natural.</text></svg>