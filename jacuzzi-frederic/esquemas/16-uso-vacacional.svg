<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect width="1400" height="820" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Chalet vacacional: ¿dejar el jacuzzi encendido?</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Según el manual HotSpring 2024 (agua y frío) · lo de 6-14 días es una extensión mía entre dos datos del manual</text><rect x="40" y="120" width="430" height="330" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="4"/><rect x="40" y="120" width="430" height="62" rx="12" fill="#2f855a"/><text class="f" x="60" y="160" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">1-5 días</text><text class="f" x="60" y="214" font-size="20" font-weight="700" fill="#2f855a" text-anchor="start">Se deja ENCENDIDO</text><text class="f" x="60" y="244" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Con corriente, tapa cerrada con candados,</text><text class="f" x="60" y="266" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">consigna 26-28 °C.</text><text class="f" x="60" y="300" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Antes de irse: ajustar pH y hacer choque de</text><text class="f" x="60" y="322" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">cloro (manual, 3-5 días).</text><text class="f" x="60" y="356" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Al volver: choque de cloro y pH otra vez.</text><rect x="490" y="120" width="430" height="330" rx="12" fill="#ffffff" stroke="#b7791f" stroke-width="4"/><rect x="490" y="120" width="430" height="62" rx="12" fill="#b7791f"/><text class="f" x="510" y="160" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">6-14 días</text><text class="f" x="510" y="214" font-size="20" font-weight="700" fill="#b7791f" text-anchor="start">ENCENDIDO si alguien lo revisa</text><text class="f" x="510" y="244" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Con corriente, tapa cerrada, consigna 26 °C.</text><text class="f" x="510" y="278" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">(Mi criterio) Alguien debe mirar cloro y pH a</text><text class="f" x="510" y="300" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">mitad: el manual solo marca 3-5 días y más de</text><text class="f" x="510" y="322" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">14.</text><text class="f" x="510" y="356" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si nadie va a revisarlo: mejor vaciarlo.</text><rect x="940" y="120" width="430" height="330" rx="12" fill="#ffffff" stroke="#d1342f" stroke-width="4"/><rect x="940" y="120" width="430" height="62" rx="12" fill="#d1342f"/><text class="f" x="960" y="160" font-size="26" font-weight="700" fill="#ffffff" text-anchor="start">Más de 14 días</text><text class="f" x="960" y="214" font-size="20" font-weight="700" fill="#d1342f" text-anchor="start">VACIAR o INVERNAR</text><text class="f" x="960" y="244" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Más de 14 días sin que nadie cuide el agua: el</text><text class="f" x="960" y="266" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">manual recomienda vaciarlo o invernarlo.</text><text class="f" x="960" y="300" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Con ozono FRESHWATER III se alarga a 4 semanas.</text><text class="f" x="960" y="334" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Siempre tapado, lleno o vacío.</text><rect x="40" y="480" width="660" height="300" rx="12" fill="#e8f0f9" stroke="#2b6cb0" stroke-width="3"/><text class="f" x="60" y="514" font-size="22" font-weight="700" fill="#2b6cb0" text-anchor="start">Y si hace frío</text><circle cx="68" cy="543" r="4" fill="#2b6cb0"/><text class="f" x="84" y="548" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Desde unos −12 °C con viento, la bomba puede helarse aunque el agua esté</text><text class="f" x="84" y="570" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">caliente (manual).</text><circle cx="68" cy="601" r="4" fill="#2b6cb0"/><text class="f" x="84" y="606" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Con la consigna baja y un corte de luz, el riesgo de helada es mayor.</text><circle cx="68" cy="637" r="4" fill="#2b6cb0"/><text class="f" x="84" y="642" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si se deja vacío en invierno: invernar con anticongelante de</text><text class="f" x="84" y="664" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">propilenglicol (nunca el de coche).</text><circle cx="68" cy="695" r="4" fill="#2b6cb0"/><text class="f" x="84" y="700" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">En Madrid lo normal es no llegar a −12 °C: en invierno, mejor encendido</text><text class="f" x="84" y="722" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">que vacío (mi criterio).</text><rect x="740" y="480" width="620" height="300" rx="12" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/><text class="f" x="760" y="514" font-size="22" font-weight="700" fill="#b7791f" text-anchor="start">Antes de que lleguen los huéspedes</text><circle cx="768" cy="543" r="4" fill="#b7791f"/><text class="f" x="784" y="548" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Subir la consigna al menos 24 h antes: de 26 a 38 °C son 14-16 h con</text><text class="f" x="784" y="570" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">el calentador a tope.</text><circle cx="768" cy="601" r="4" fill="#b7791f"/><text class="f" x="784" y="606" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si estuvo apagado o frío (15 °C), hasta 26-31 h: subirla 2 días</text><text class="f" x="784" y="628" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">antes.</text><circle cx="768" cy="659" r="4" fill="#b7791f"/><text class="f" x="784" y="664" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Pedirle a Frederic que alguien compruebe el agua (cloro y pH) antes.</text><circle cx="768" cy="695" r="4" fill="#b7791f"/><text class="f" x="784" y="700" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Consumo: ver la tabla de tiempo y kWh (arriba, imagen 15).</text></svg>