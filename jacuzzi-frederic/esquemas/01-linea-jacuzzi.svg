<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="665" viewBox="0 0 1400 665"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="665" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">La línea del jacuzzi, de principio a fin</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Cómo quedó montada el 8/10/2026 y qué protege cada aparato (casa de Frederic, TR-20)</text><rect x="50" y="250" width="170" height="130" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="135.0" y="280" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Contador</text><text class="f" x="135.0" y="304" font-size="15" fill="#1f2933" text-anchor="middle">Sagemcom S212</text><text class="f" x="135.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">lleva el ICP dentro</text><text class="f" x="135.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">corta si pasas</text><text class="f" x="135.0" y="367" font-size="15" fill="#1f2933" text-anchor="middle">de 9 kW (≈ 39 A)</text><rect x="276" y="250" width="170" height="130" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="361.0" y="280" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">IGA C40</text><text class="f" x="361.0" y="304" font-size="15" fill="#1f2933" text-anchor="middle">interruptor general</text><text class="f" x="361.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">40 A ≈ 9,2 kW</text><text class="f" x="361.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">reparte a todos los</text><text class="f" x="361.0" y="367" font-size="15" fill="#1f2933" text-anchor="middle">diferenciales</text><rect x="502" y="250" width="170" height="130" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="587.0" y="280" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Tu diferencial</text><text class="f" x="587.0" y="304" font-size="15" fill="#1f2933" text-anchor="middle">2P · 40 A · 30 mA</text><text class="f" x="587.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">tipo F · Resi9</text><text class="f" x="587.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">fila de arriba</text><text class="f" x="587.0" y="367" font-size="15" fill="#2563eb" text-anchor="middle">protege a personas</text><rect x="728" y="250" width="170" height="130" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="813.0" y="280" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Tu C20</text><text class="f" x="813.0" y="304" font-size="15" fill="#1f2933" text-anchor="middle">magnetotérmico 2P</text><text class="f" x="813.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">curva C · Resi9</text><text class="f" x="813.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">fila de abajo</text><text class="f" x="813.0" y="367" font-size="15" fill="#2f855a" text-anchor="middle">protege el cable</text><rect x="954" y="250" width="170" height="130" rx="10" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/><text class="f" x="1039.0" y="280" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Punto intermedio</text><text class="f" x="1039.0" y="304" font-size="15" fill="#d1342f" text-anchor="middle">hoy: Schuko 16 A</text><text class="f" x="1039.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">plan: interruptor</text><text class="f" x="1039.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">de corte 2P 32 A</text><text class="f" x="1039.0" y="367" font-size="15" fill="#1f2933" text-anchor="middle">en caja IP65</text><rect x="1180" y="250" width="170" height="130" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text class="f" x="1265.0" y="280" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Jacuzzi</text><text class="f" x="1265.0" y="304" font-size="15" fill="#1f2933" text-anchor="middle">HotSpring Envoy</text><text class="f" x="1265.0" y="325" font-size="15" fill="#1f2933" text-anchor="middle">230 V · 20 A máx.</text><text class="f" x="1265.0" y="346" font-size="15" fill="#1f2933" text-anchor="middle">≈ 4,6 kW a tope</text><text class="f" x="1265.0" y="367" font-size="15" fill="#1f2933" text-anchor="middle">IPX5</text><line x1="220" y1="315.0" x2="272" y2="315.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="272,315.0 261.6,321.0 261.6,309.0" fill="#5f6b7a"/><line x1="446" y1="315.0" x2="498" y2="315.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="498,315.0 487.6,321.0 487.6,309.0" fill="#5f6b7a"/><line x1="672" y1="315.0" x2="724" y2="315.0" stroke="#5f6b7a" stroke-width="3"/><polygon points="724,315.0 713.6,321.0 713.6,309.0" fill="#5f6b7a"/><line x1="898" y1="315.0" x2="950" y2="315.0" stroke="#8b4513" stroke-width="4"/><polygon points="950,315.0 939.6,321.0 939.6,309.0" fill="#8b4513"/><line x1="1124" y1="315.0" x2="1176" y2="315.0" stroke="#8b4513" stroke-width="4"/><polygon points="1176,315.0 1165.6,321.0 1165.6,309.0" fill="#8b4513"/><rect x="542" y="130" width="360" height="70" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2" stroke-dasharray="6 5"/><text class="f" x="722.0" y="160" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Otros 5 diferenciales (D1-D5)</text><text class="f" x="722.0" y="184" font-size="14" fill="#1f2933" text-anchor="middle">aires, coche V2C, cocina, baños, aerotermia</text><line x1="361.0" y1="250" x2="361.0" y2="165" stroke="#5f6b7a" stroke-width="2" stroke-dasharray="6 5"/><line x1="361.0" y1="165" x2="538" y2="165" stroke="#5f6b7a" stroke-width="2" stroke-dasharray="6 5"/><polygon points="538,165 527.6,171.0 527.6,159.0" fill="#5f6b7a"/><text class="f" x="369.0" y="225" font-size="13" fill="#5f6b7a">en paralelo</text><rect x="361.0" y="405" width="537.0" height="78" rx="8" fill="#fdf0e2" stroke="#d9730d" stroke-width="2"/><text class="f" x="375.0" y="429" font-size="15" font-weight="700" fill="#d9730d">Puentes de 6 mm²: IGA → diferencial → C20</text><text class="f" x="375.0" y="451" font-size="14" fill="#1f2933">Solo los protege el IGA C40: deben aguantar 40 A.</text><text class="f" x="375.0" y="471" font-size="14" fill="#1f2933">6 mm² aguanta ≈ 41-46 A dentro del cuadro: bien.</text><rect x="904" y="405" width="446" height="78" rx="8" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="918" y="429" font-size="15" font-weight="700" fill="#d1342f">Línea de 2,5 mm²: RZ1-K 3G2,5, ≈ 25 m</text><text class="f" x="918" y="451" font-size="14" fill="#1f2933">La protege el C20. Para 20 A lo habitual es 4-6 mm².</text><text class="f" x="918" y="471" font-size="14" fill="#1f2933">Caída a 20 A: 3,95 % no cumple (máx. 3 %).</text><rect x="50.0" y="510" width="310" height="125" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="66.0" y="540" font-size="18" font-weight="700" fill="#2563eb">Diferencial</text><text class="f" x="66.0" y="568" font-size="15" fill="#1f2933">Protege a las personas.</text><text class="f" x="66.0" y="590" font-size="15" fill="#1f2933">Salta si se escapan 30 mA</text><text class="f" x="66.0" y="612" font-size="15" fill="#1f2933">o más hacia tierra.</text><rect x="380.0" y="510" width="310" height="125" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="396.0" y="540" font-size="18" font-weight="700" fill="#2f855a">Magnetotérmico</text><text class="f" x="396.0" y="568" font-size="15" fill="#1f2933">Protege el cable. Salta por</text><text class="f" x="396.0" y="590" font-size="15" fill="#1f2933">sobrecarga (al rato) o por</text><text class="f" x="396.0" y="612" font-size="15" fill="#1f2933">cortocircuito (al instante).</text><rect x="710.0" y="510" width="310" height="125" rx="10" fill="#f1ebfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="726.0" y="540" font-size="18" font-weight="700" fill="#6b46c1">RCBO</text><text class="f" x="726.0" y="568" font-size="15" fill="#1f2933">Diferencial + magnetotérmico</text><text class="f" x="726.0" y="590" font-size="15" fill="#1f2933">en un solo aparato de</text><text class="f" x="726.0" y="612" font-size="15" fill="#1f2933">2 módulos (36 mm).</text><rect x="1040.0" y="510" width="310" height="125" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><text class="f" x="1056.0" y="540" font-size="18" font-weight="700" fill="#a16207">Interruptor de corte</text><text class="f" x="1056.0" y="568" font-size="15" fill="#1f2933">No protege nada: solo abre</text><text class="f" x="1056.0" y="590" font-size="15" fill="#1f2933">el circuito. Necesita el C20</text><text class="f" x="1056.0" y="612" font-size="15" fill="#1f2933">del cuadro antes.</text></svg>