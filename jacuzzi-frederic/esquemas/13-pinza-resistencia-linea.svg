<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect width="1400" height="800" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">La pinza: dónde ponerla y qué número sacar</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Y cómo se convierte en la resistencia de la línea (R = caída ÷ amperios)</text><rect x="40" y="120" width="640" height="330" rx="12" fill="#ffffff" stroke="#2f855a" stroke-width="3"/><text class="f" x="60" y="156" font-size="20" font-weight="700" fill="#2f855a" text-anchor="start">✔ Bien: pinza en UN solo hilo (el marrón)</text><line x1="100" y1="305" x2="620" y2="305" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="350" x2="620" y2="350" stroke="#2b6cb0" stroke-width="9" stroke-linecap="round"/><line x1="100" y1="375" x2="620" y2="375" stroke="#2f855a" stroke-width="6" stroke-linecap="round"/><circle cx="360" cy="305" r="27" fill="none" stroke="#1f2933" stroke-width="8"/><line x1="360" y1="278" x2="360" y2="245" stroke="#1f2933" stroke-width="8"/><rect x="300" y="185" width="120" height="60" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="3"/><text class="f" x="360" y="226" font-size="26" font-weight="700" fill="#2f855a" text-anchor="middle">7,8 A</text><text class="f" x="360" y="430" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">Marrón dentro de la pinza · azul y verde fuera</text><rect x="720" y="120" width="640" height="330" rx="12" fill="#ffffff" stroke="#d1342f" stroke-width="3"/><text class="f" x="740" y="156" font-size="20" font-weight="700" fill="#d1342f" text-anchor="start">✖ Mal: pinza abrazando toda la manguera</text><line x1="780" y1="305" x2="1300" y2="305" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/><line x1="780" y1="350" x2="1300" y2="350" stroke="#2b6cb0" stroke-width="9" stroke-linecap="round"/><line x1="780" y1="375" x2="1300" y2="375" stroke="#2f855a" stroke-width="6" stroke-linecap="round"/><circle cx="1040" cy="340" r="68" fill="none" stroke="#1f2933" stroke-width="8"/><line x1="1040" y1="272" x2="1040" y2="245" stroke="#1f2933" stroke-width="8"/><rect x="980" y="185" width="120" height="60" rx="8" fill="#ffffff" stroke="#d1342f" stroke-width="3"/><text class="f" x="1040" y="226" font-size="26" font-weight="700" fill="#d1342f" text-anchor="middle">0,0 A</text><text class="f" x="1040" y="430" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">La ida (marrón) y la vuelta (azul) se anulan: marca ≈ 0</text><text class="f" x="40" y="500" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Dos ejemplos con 8 A (calentando solo) en 29 m de 2,5 mm²</text><rect x="40" y="515" width="220" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="150.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle"></text><rect x="260" y="515" width="160" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="340.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">V1 casa</text><rect x="420" y="515" width="160" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="500.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">V2 spa</text><rect x="580" y="515" width="160" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="660.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Caída</text><rect x="740" y="515" width="200" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="840.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Resistencia</text><rect x="940" y="515" width="420" height="40" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="1150.0" y="541" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Veredicto</text><rect x="40" y="555" width="220" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="150.0" y="583" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Línea sana</text><rect x="260" y="555" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="340.0" y="583" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">231,0 V</text><rect x="420" y="555" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="500.0" y="583" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">226,9 V</text><rect x="580" y="555" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="660.0" y="583" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">4,1 V</text><rect x="740" y="555" width="200" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="840.0" y="583" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">0,51 Ω</text><rect x="940" y="555" width="420" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="1150.0" y="583" font-size="15" font-weight="700" fill="#2f855a" text-anchor="middle">Normal (esperable 0,43-0,53 Ω)</text><rect x="40" y="599" width="220" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="150.0" y="627" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Mal contacto</text><rect x="260" y="599" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="340.0" y="627" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">231,0 V</text><rect x="420" y="599" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="500.0" y="627" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">224,5 V</text><rect x="580" y="599" width="160" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="660.0" y="627" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">6,5 V</text><rect x="740" y="599" width="200" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="840.0" y="627" font-size="15" font-weight="400" fill="#1f2933" text-anchor="middle">0,81 Ω</text><rect x="940" y="599" width="420" height="44" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="1150.0" y="627" font-size="15" font-weight="700" fill="#d1342f" text-anchor="middle">Sobra mucho: borne, unión o clavija</text><rect x="40" y="665" width="1320" height="110" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/><text class="f" x="60" y="696" font-size="17" font-weight="700" fill="#b7791f" text-anchor="start">Cómo interpretar la R (cobre 2,5 mm², ida y vuelta)</text><text class="f" x="60" y="722" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">29 m: esperable 0,43-0,53 Ω · sospechoso si pasa de 0,6 Ω</text><text class="f" x="700" y="722" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">35 m: esperable 0,52-0,64 Ω · sospechoso si pasa de 0,72 Ω</text><text class="f" x="60" y="752" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Si la R sale alta, apaga y revisa bornes, uniones y la clavija: un solo punto con 0,1-0,3 Ω de más ya se nota. Mide a la misma temperatura del cable (sin haber calentado horas).</text></svg>