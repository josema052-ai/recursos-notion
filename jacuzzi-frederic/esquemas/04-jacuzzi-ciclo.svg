<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="640" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Qué hace el jacuzzi aunque nadie lo use</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">No tiene botón de apagado: con corriente y con agua, calienta y filtra solo. El único apagado de verdad es el diferencial o el C20.</text><rect x="40" y="130" width="290" height="140" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text class="f" x="58" y="164" font-size="19" font-weight="700" fill="#0f766e">1. Purga</text><text class="f" x="58" y="194" font-size="15" fill="#1f2933">Al darle corriente llena de</text><text class="f" x="58" y="216" font-size="15" fill="#1f2933">aire las bombas unos minutos.</text><line x1="332" y1="200.0" x2="356" y2="200.0" stroke="#0f766e" stroke-width="3"/><polygon points="356,200.0 345.6,206.0 345.6,194.0" fill="#0f766e"/><rect x="360" y="130" width="290" height="140" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text class="f" x="378" y="164" font-size="19" font-weight="700" fill="#0f766e">2. Calienta</text><text class="f" x="378" y="194" font-size="15" fill="#1f2933">Hasta la temperatura de</text><text class="f" x="378" y="216" font-size="15" fill="#1f2933">consigna. Resistencia de 1,5</text><text class="f" x="378" y="238" font-size="15" fill="#1f2933">a 4 kW según la versión.</text><line x1="652" y1="200.0" x2="676" y2="200.0" stroke="#0f766e" stroke-width="3"/><polygon points="676,200.0 665.6,206.0 665.6,194.0" fill="#0f766e"/><rect x="680" y="130" width="290" height="140" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text class="f" x="698" y="164" font-size="19" font-weight="700" fill="#0f766e">3. Filtra</text><text class="f" x="698" y="194" font-size="15" fill="#1f2933">Varias veces al día,</text><text class="f" x="698" y="216" font-size="15" fill="#1f2933">por temporizador.</text><line x1="972" y1="200.0" x2="996" y2="200.0" stroke="#0f766e" stroke-width="3"/><polygon points="996,200.0 985.6,206.0 985.6,194.0" fill="#0f766e"/><rect x="1000" y="130" width="290" height="140" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="2"/><text class="f" x="1018" y="164" font-size="19" font-weight="700" fill="#0f766e">4. Se enfría y repone</text><text class="f" x="1018" y="194" font-size="15" fill="#1f2933">El agua pierde calor al aire</text><text class="f" x="1018" y="216" font-size="15" fill="#1f2933">(más en noches frías) y la</text><text class="f" x="1018" y="238" font-size="15" fill="#1f2933">resistencia vuelve a entrar.</text><line x1="1145.0" y1="270" x2="1145.0" y2="300" stroke="#0f766e" stroke-width="3"/><line x1="1145.0" y1="300" x2="505.0" y2="300" stroke="#0f766e" stroke-width="3"/><line x1="505.0" y1="300" x2="505.0" y2="274" stroke="#0f766e" stroke-width="3"/><polygon points="505.0,274 511.0,284.3 499.0,284.3" fill="#0f766e"/><text class="f" x="700" y="322" font-size="13" fill="#0f766e" text-anchor="middle">vuelta a empezar</text><rect x="40" y="345" width="640" height="120" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="58" y="378" font-size="18" font-weight="700" fill="#1f2933">Los botones del panel auxiliar (4 botones)</text><text class="f" x="58" y="406" font-size="15" fill="#1f2933">JETS: bombas de masaje (ciclo de 6 pasos; se apagan solos a las 2 h).</text><text class="f" x="58" y="428" font-size="15" fill="#1f2933">LIGHT +/−: la luz. MODE: el audio, si tiene sonido.</text><text class="f" x="58" y="450" font-size="15" fill="#1f2933">Calentar y filtrar es automático: no hay botón general.</text><rect x="720" y="345" width="640" height="255" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="738" y="378" font-size="18" font-weight="700" fill="#1f2933">Calentar 1.475 L de 15 a 38 °C ≈ 39 kWh</text><text class="f" x="738" y="402" font-size="14" fill="#5f6b7a">Horas seguidas según la potencia de la resistencia (sin contar pérdidas):</text><text class="f" x="738" y="452" font-size="16" font-weight="700" fill="#1f2933">1,5 kW</text><rect x="810" y="430" width="430.0" height="32" rx="6" fill="#d9730d" stroke="#d9730d" stroke-width="2"/><text class="f" x="1250.0" y="452" font-size="16" font-weight="700" fill="#d9730d">≈ 26 h</text><text class="f" x="738" y="500" font-size="16" font-weight="700" fill="#1f2933">3 kW</text><rect x="810" y="478" width="215.0" height="32" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="1035.0" y="500" font-size="16" font-weight="700" fill="#2563eb">≈ 13 h</text><text class="f" x="738" y="548" font-size="16" font-weight="700" fill="#1f2933">4 kW</text><rect x="810" y="526" width="161.2" height="32" rx="6" fill="#2f855a" stroke="#2f855a" stroke-width="2"/><text class="f" x="981.2" y="548" font-size="16" font-weight="700" fill="#2f855a">≈ 10 h</text><text class="f" x="738" y="585" font-size="13" fill="#5f6b7a">Cálculo: 39 kWh ÷ potencia. Con 1,5 kW es una cuenta mía (26 h).</text><rect x="40" y="485" width="640" height="115" rx="10" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/><text class="f" x="58" y="518" font-size="18" font-weight="700" fill="#a16207">Entre huéspedes</text><text class="f" x="58" y="546" font-size="15" fill="#1f2933">Pocos días libres: con corriente, tapado y consigna baja (≈ 26-28 °C);</text><text class="f" x="58" y="568" font-size="15" fill="#1f2933">subirlo el día antes. Semanas vacía: apagarlo con el interruptor</text><text class="f" x="58" y="590" font-size="15" fill="#1f2933">(con frío, vaciar o antihielo según el manual).</text></svg>