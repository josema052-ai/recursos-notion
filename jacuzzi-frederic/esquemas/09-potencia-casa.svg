<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="640" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Lo que puede gastar la casa frente a lo contratado</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">kW a la vez · 9 kW contratados según Frederic (≈ 39 A, por confirmar en la factura)</text><line x1="938" y1="120" x2="938" y2="502" stroke="#d1342f" stroke-width="2" stroke-dasharray="7 6"/><line x1="1010.8" y1="120" x2="1010.8" y2="502" stroke="#d9730d" stroke-width="2" stroke-dasharray="7 6"/><text class="f" x="932" y="114" font-size="14" font-weight="700" fill="#d1342f" text-anchor="end">9 kW contratados</text><text class="f" x="1016.8" y="114" font-size="14" font-weight="700" fill="#d9730d">10,4 kW (IGA C40)</text><text class="f" x="454" y="157" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Casa sola, sin coche (V2C, 11/10)</text><rect x="470" y="130" width="426.4" height="40" rx="4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><rect x="900.4" y="138" width="123.8" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="906.4" y="157" font-size="15" font-weight="700" fill="#1f2933">8,2 kW medido</text><text class="f" x="454" y="219" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Casa + jacuzzi calentando (1,5-4 kW)</text><rect x="470" y="192" width="426.4" height="40" rx="4" fill="#2563eb" stroke="#ffffff" stroke-width="1"/><rect x="896.4" y="192" width="78.0" height="40" rx="4" fill="#0f766e" stroke="#ffffff" stroke-width="1"/><rect x="974.4" y="192" width="130.0" height="40" rx="4" fill="#9fd4cf" stroke="#ffffff" stroke-width="1"/><rect x="1108.4" y="200" width="106.6" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="1114.4" y="219" font-size="15" font-weight="700" fill="#1f2933">9,7-12,2 kW</text><text class="f" x="454" y="281" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Escenario «normal» (estimado)</text><rect x="470" y="254" width="468.0" height="40" rx="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1"/><rect x="942.0" y="262" width="63.5" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="948.0" y="281" font-size="15" font-weight="700" fill="#1f2933">9,0 kW</text><text class="f" x="454" y="343" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Coche a 32 A + jacuzzi calentando</text><rect x="470" y="316" width="384.8" height="40" rx="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1"/><rect x="854.8" y="316" width="156.0" height="40" rx="4" fill="#0f766e" stroke="#ffffff" stroke-width="1"/><rect x="1014.8" y="324" width="72.1" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="1020.8" y="343" font-size="15" font-weight="700" fill="#1f2933">10,4 kW</text><text class="f" x="454" y="405" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Contador, registro 1.16.0 (12:46)</text><rect x="470" y="378" width="534.5" height="40" rx="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1"/><rect x="1008.5" y="386" width="261.4" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="1014.5" y="405" font-size="15" font-weight="700" fill="#1f2933">10,28 kW (coma sin confirmar)</text><text class="f" x="454" y="467" font-size="16" font-weight="700" fill="#1f2933" text-anchor="end">Escenario «alto» (estimado)</text><rect x="470" y="440" width="790.4" height="40" rx="4" fill="#94a3b8" stroke="#ffffff" stroke-width="1"/><rect x="1264.4" y="448" width="72.1" height="26" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text class="f" x="1270.4" y="467" font-size="15" font-weight="700" fill="#1f2933">15,2 kW</text><text class="f" x="470" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">0</text><text class="f" x="574" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">2</text><text class="f" x="678" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">4</text><text class="f" x="782" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">6</text><text class="f" x="886" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">8</text><text class="f" x="990" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">10</text><text class="f" x="1094" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">12</text><text class="f" x="1198" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">14</text><text class="f" x="1302" y="520" font-size="13" fill="#5f6b7a" text-anchor="middle">16</text><text class="f" x="886" y="542" font-size="13" fill="#5f6b7a" text-anchor="middle">kW</text><rect x="40" y="560" width="1320" height="64" rx="10" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/><text class="f" x="60" y="586" font-size="15" fill="#1f2933">Entre 9 y 13 kW el que corta es el contador (ICP): con poco exceso puede tardar hasta ≈ media hora; con el doble, segundos (valores</text><text class="f" x="60" y="608" font-size="15" fill="#1f2933">no oficiales). El IGA C40 no dispara por debajo de 45,2 A (≈ 10,4 kW) en una hora. Barras grises = estimaciones o datos sin confirmar.</text></svg>