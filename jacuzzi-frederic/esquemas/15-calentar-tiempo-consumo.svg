<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect width="1400" height="980" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Calentar el jacuzzi: temperatura, tiempo y consumo</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Calentador de 1.500 W (6,5 A) · agua 1.475-1.725 L · cálculo sin pérdidas: la realidad es algo más (tapa, viento, frío)</text><rect x="40" y="110" width="1320" height="76" rx="10" fill="#fff8e6" stroke="#b7791f" stroke-width="3"/><text class="f" x="60" y="140" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Regla para recordar:  1 °C de subida ≈ 1,7-2,0 kWh  ≈ 1,1-1,3 h de calentador.</text><text class="f" x="60" y="168" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">El agua sube menos de 1 °C por hora (0,75-0,87 °C/h con 1.500 W). Por eso se sube la consigna con un día de antelación.</text><text class="f" x="60" y="210" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">De → a</text><text class="f" x="330" y="210" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Horas seguidas con 1.500 W</text><text class="f" x="1010" y="210" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Energía</text><text class="f" x="1210" y="210" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Coste (ej.)</text><rect x="40" y="230" width="1320" height="112" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><rect x="73" y="244" width="14" height="46" rx="7" fill="#fff" stroke="#1f2933" stroke-width="3"/><circle cx="80" cy="298" r="12" fill="#2f855a" stroke="#1f2933" stroke-width="3"/><rect x="77" y="273" width="6" height="25" fill="#2f855a"/><text class="f" x="120" y="276" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">26 → 38 °C</text><text class="f" x="120" y="302" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">sube 12 °C</text><text class="f" x="120" y="326" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Consigna mínima → uso normal</text><rect x="330" y="264" width="178.1" height="30" rx="6" fill="#2b6cb0"/><rect x="508.1" y="264" width="31.200000000000028" height="30" rx="6" fill="#9db9dd"/><text class="f" x="553.3" y="286" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="start">14-16 h</text><rect x="1016" y="276" width="28" height="26" rx="5" fill="#fde7b0" stroke="#1f2933" stroke-width="3"/><line x1="1024" y1="276" x2="1024" y2="264" stroke="#1f2933" stroke-width="4"/><line x1="1036" y1="276" x2="1036" y2="264" stroke="#1f2933" stroke-width="4"/><text class="f" x="1056" y="284" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">20,6-24,1</text><text class="f" x="1056" y="306" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">kWh</text><text class="f" x="1210" y="284" font-size="22" font-weight="700" fill="#2f855a" text-anchor="start">3,1-3,6 €</text><text class="f" x="1210" y="306" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">a 0,15 €/kWh</text><rect x="40" y="356" width="1320" height="112" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><rect x="73" y="370" width="14" height="46" rx="7" fill="#fff" stroke="#1f2933" stroke-width="3"/><circle cx="80" cy="424" r="12" fill="#2f855a" stroke="#1f2933" stroke-width="3"/><rect x="77" y="402" width="6" height="22" fill="#2f855a"/><text class="f" x="120" y="402" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">28 → 38 °C</text><text class="f" x="120" y="428" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">sube 10 °C</text><text class="f" x="120" y="452" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Mantenido a 28 °C → uso</text><rect x="330" y="390" width="148.20000000000002" height="30" rx="6" fill="#2b6cb0"/><rect x="478.20000000000005" y="390" width="26.0" height="30" rx="6" fill="#9db9dd"/><text class="f" x="518.2" y="412" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="start">11-13 h</text><rect x="1016" y="402" width="28" height="26" rx="5" fill="#fde7b0" stroke="#1f2933" stroke-width="3"/><line x1="1024" y1="402" x2="1024" y2="390" stroke="#1f2933" stroke-width="4"/><line x1="1036" y1="402" x2="1036" y2="390" stroke="#1f2933" stroke-width="4"/><text class="f" x="1056" y="410" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">17,2-20,1</text><text class="f" x="1056" y="432" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">kWh</text><text class="f" x="1210" y="410" font-size="22" font-weight="700" fill="#2f855a" text-anchor="start">2,6-3,0 €</text><text class="f" x="1210" y="432" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">a 0,15 €/kWh</text><rect x="40" y="482" width="1320" height="112" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><rect x="73" y="496" width="14" height="46" rx="7" fill="#fff" stroke="#1f2933" stroke-width="3"/><circle cx="80" cy="550" r="12" fill="#d97706" stroke="#1f2933" stroke-width="3"/><rect x="77" y="517" width="6" height="33" fill="#d97706"/><text class="f" x="120" y="528" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">20 → 38 °C</text><text class="f" x="120" y="554" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">sube 18 °C</text><text class="f" x="120" y="578" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Agua que se ha enfriado</text><rect x="330" y="516" width="267.8" height="30" rx="6" fill="#2b6cb0"/><rect x="597.8" y="516" width="45.5" height="30" rx="6" fill="#9db9dd"/><text class="f" x="657.3" y="538" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="start">21-24 h</text><rect x="1016" y="528" width="28" height="26" rx="5" fill="#fde7b0" stroke="#1f2933" stroke-width="3"/><line x1="1024" y1="528" x2="1024" y2="516" stroke="#1f2933" stroke-width="4"/><line x1="1036" y1="528" x2="1036" y2="516" stroke="#1f2933" stroke-width="4"/><text class="f" x="1056" y="536" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">30,9-36,1</text><text class="f" x="1056" y="558" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">kWh</text><text class="f" x="1210" y="536" font-size="22" font-weight="700" fill="#2f855a" text-anchor="start">4,6-5,4 €</text><text class="f" x="1210" y="558" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">a 0,15 €/kWh</text><rect x="40" y="608" width="1320" height="112" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><rect x="73" y="622" width="14" height="46" rx="7" fill="#fff" stroke="#1f2933" stroke-width="3"/><circle cx="80" cy="676" r="12" fill="#d97706" stroke="#1f2933" stroke-width="3"/><rect x="77" y="636" width="6" height="40" fill="#d97706"/><text class="f" x="120" y="654" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">15 → 38 °C</text><text class="f" x="120" y="680" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">sube 23 °C</text><text class="f" x="120" y="704" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Arranque en otoño (agua nueva)</text><rect x="330" y="642" width="341.90000000000003" height="30" rx="6" fill="#2b6cb0"/><rect x="671.9000000000001" y="642" width="57.19999999999998" height="30" rx="6" fill="#9db9dd"/><text class="f" x="743.0999999999999" y="664" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="start">26-31 h</text><rect x="1016" y="654" width="28" height="26" rx="5" fill="#fde7b0" stroke="#1f2933" stroke-width="3"/><line x1="1024" y1="654" x2="1024" y2="642" stroke="#1f2933" stroke-width="4"/><line x1="1036" y1="654" x2="1036" y2="642" stroke="#1f2933" stroke-width="4"/><text class="f" x="1056" y="662" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">39,5-46,1</text><text class="f" x="1056" y="684" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">kWh</text><text class="f" x="1210" y="662" font-size="22" font-weight="700" fill="#2f855a" text-anchor="start">5,9-6,9 €</text><text class="f" x="1210" y="684" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">a 0,15 €/kWh</text><rect x="40" y="734" width="1320" height="112" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><rect x="73" y="748" width="14" height="46" rx="7" fill="#fff" stroke="#1f2933" stroke-width="3"/><circle cx="80" cy="802" r="12" fill="#d97706" stroke="#1f2933" stroke-width="3"/><rect x="77" y="754" width="6" height="48" fill="#d97706"/><text class="f" x="120" y="780" font-size="24" font-weight="700" fill="#1f2933" text-anchor="start">10 → 38 °C</text><text class="f" x="120" y="806" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">sube 28 °C</text><text class="f" x="120" y="830" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Arranque en invierno</text><rect x="330" y="768" width="416.0" height="30" rx="6" fill="#2b6cb0"/><rect x="746.0" y="768" width="71.5" height="30" rx="6" fill="#9db9dd"/><text class="f" x="831.5" y="790" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="start">32-38 h</text><rect x="1016" y="780" width="28" height="26" rx="5" fill="#fde7b0" stroke="#1f2933" stroke-width="3"/><line x1="1024" y1="780" x2="1024" y2="768" stroke="#1f2933" stroke-width="4"/><line x1="1036" y1="780" x2="1036" y2="768" stroke="#1f2933" stroke-width="4"/><text class="f" x="1056" y="788" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">48,0-56,2</text><text class="f" x="1056" y="810" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">kWh</text><text class="f" x="1210" y="788" font-size="22" font-weight="700" fill="#2f855a" text-anchor="start">7,2-8,4 €</text><text class="f" x="1210" y="810" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">a 0,15 €/kWh</text><rect x="40" y="864" width="1320" height="56" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="60" y="890" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Azul oscuro = con 1.475 L (ficha HotSpring)   ·   Azul claro = hasta 1.725 L (manual 2024).</text><text class="f" x="60" y="910" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">El precio del kWh de Frederic cámbialo por el de su factura. Horas = kWh ÷ 1,5 kW. Mantener la temperatura (pérdidas) se mide con el contador, no se puede calcular sin datos.</text></svg>