<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="660" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Facturar un trabajo suelto sin ser autónomo</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Camino del 037 para un trabajo puntual (información divulgativa: confirmar con gestor o con Legálitas)</text><rect x="40" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="66" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="66" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text class="f" x="90" y="155" font-size="17" font-weight="700" fill="#2563eb">Modelo 037</text><text class="f" x="56" y="192" font-size="14" fill="#1f2933">Alta en Hacienda (censo).</text><text class="f" x="56" y="213" font-size="14" fill="#1f2933">Gratis y sin cuota.</text><text class="f" x="56" y="234" font-size="14" fill="#1f2933">Mejor antes de comprar.</text><line x1="246" y1="202.5" x2="260" y2="202.5" stroke="#2563eb" stroke-width="3"/><polygon points="260,202.5 249.6,208.5 249.6,196.5" fill="#2563eb"/><rect x="263" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="289" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="289" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text class="f" x="313" y="155" font-size="17" font-weight="700" fill="#2563eb">Compra</text><text class="f" x="279" y="192" font-size="14" fill="#1f2933">Con factura a tu nombre</text><text class="f" x="279" y="213" font-size="14" fill="#1f2933">y DNI. Pagas lo mismo</text><text class="f" x="279" y="234" font-size="14" fill="#1f2933">(con IVA). Guarda tickets.</text><line x1="469" y1="202.5" x2="483" y2="202.5" stroke="#2563eb" stroke-width="3"/><polygon points="483,202.5 472.6,208.5 472.6,196.5" fill="#2563eb"/><rect x="486" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="512" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="512" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text class="f" x="536" y="155" font-size="17" font-weight="700" fill="#2563eb">Factura</text><text class="f" x="502" y="192" font-size="14" fill="#1f2933">Con IVA del 21 %:</text><text class="f" x="502" y="213" font-size="14" fill="#1f2933">640 € = ≈ 529 € + ≈ 111 €</text><text class="f" x="502" y="234" font-size="14" fill="#1f2933">de IVA (no se suma).</text><line x1="692" y1="202.5" x2="706" y2="202.5" stroke="#2563eb" stroke-width="3"/><polygon points="706,202.5 695.6,208.5 695.6,196.5" fill="#2563eb"/><rect x="709" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="735" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="735" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text class="f" x="759" y="155" font-size="17" font-weight="700" fill="#2563eb">Modelo 303</text><text class="f" x="725" y="192" font-size="14" fill="#1f2933">IVA del trimestre:</text><text class="f" x="725" y="213" font-size="14" fill="#1f2933">IVA cobrado menos el IVA</text><text class="f" x="725" y="234" font-size="14" fill="#1f2933">del material con factura.</text><line x1="915" y1="202.5" x2="929" y2="202.5" stroke="#2563eb" stroke-width="3"/><polygon points="929,202.5 918.6,208.5 918.6,196.5" fill="#2563eb"/><rect x="932" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="958" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="958" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text class="f" x="982" y="155" font-size="17" font-weight="700" fill="#2563eb">Baja</text><text class="f" x="948" y="192" font-size="14" fill="#1f2933">Con el mismo modelo</text><text class="f" x="948" y="213" font-size="14" fill="#1f2933">(036 o 037).</text><line x1="1138" y1="202.5" x2="1152" y2="202.5" stroke="#2563eb" stroke-width="3"/><polygon points="1152,202.5 1141.6,208.5 1141.6,196.5" fill="#2563eb"/><rect x="1155" y="120" width="205" height="165" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><circle cx="1181" cy="148" r="15" fill="#2563eb" stroke="#2563eb" stroke-width="2"/><text class="f" x="1181" y="154" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text class="f" x="1205" y="155" font-size="17" font-weight="700" fill="#2563eb">Renta</text><text class="f" x="1171" y="192" font-size="14" fill="#1f2933">El beneficio va en la renta</text><text class="f" x="1171" y="213" font-size="14" fill="#1f2933">del año siguiente (ver el</text><text class="f" x="1171" y="234" font-size="14" fill="#1f2933">límite de 1.000 €).</text><rect x="40" y="320" width="312" height="140" rx="10" fill="#f1ebfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="56" y="352" font-size="17" font-weight="700" fill="#6b46c1">Autónomo es otra cosa</text><text class="f" x="56" y="382" font-size="14" fill="#1f2933">El alta de autónomo es en la Seguridad</text><text class="f" x="56" y="403" font-size="14" fill="#1f2933">Social y se exige si la actividad es</text><text class="f" x="56" y="424" font-size="14" fill="#1f2933">habitual. Un anuncio fijo puede verse así.</text><rect x="376" y="320" width="312" height="140" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="392" y="352" font-size="17" font-weight="700" fill="#d1342f">Sin 037 no hay factura</text><text class="f" x="392" y="382" font-size="14" fill="#1f2933">Con el DNI solo, lo que haces es</text><text class="f" x="392" y="403" font-size="14" fill="#1f2933">un recibo, no una factura.</text><rect x="712" y="320" width="312" height="140" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><text class="f" x="728" y="352" font-size="17" font-weight="700" fill="#a16207">Si cobras una prestación</text><text class="f" x="728" y="382" font-size="14" fill="#1f2933">Cualquier trabajo se comunica al SEPE,</text><text class="f" x="728" y="403" font-size="14" fill="#1f2933">aunque facture otro. Preguntar antes</text><text class="f" x="728" y="424" font-size="14" fill="#1f2933">al SEPE o a Legálitas.</text><rect x="1048" y="320" width="312" height="140" rx="10" fill="#f4f6f8" stroke="#1f2933" stroke-width="2"/><text class="f" x="1064" y="352" font-size="17" font-weight="700" fill="#1f2933">El boletín es aparte</text><text class="f" x="1064" y="382" font-size="14" fill="#1f2933">Solo lo firma una empresa instaladora</text><text class="f" x="1064" y="403" font-size="14" fill="#1f2933">habilitada. Tú no puedes; tu colega</text><text class="f" x="1064" y="424" font-size="14" fill="#1f2933">tampoco hasta darse de alta como tal.</text><rect x="40" y="490" width="1320" height="140" rx="10" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="60" y="524" font-size="17" font-weight="700" fill="#1f2933">La renta: cuándo no hace falta</text><text class="f" x="60" y="554" font-size="15" fill="#1f2933">Si en todo el año solo tuvieras este trabajo, no: el límite conjunto es de 1.000 € al año (art. 96 de la Ley del IRPF).</text><text class="f" x="60" y="578" font-size="15" fill="#1f2933">Cuentan los ingresos sin IVA (≈ 512-529 €), no el beneficio, y se suman todos tus ingresos del año (nóminas, prestaciones…).</text><text class="f" x="60" y="602" font-size="15" fill="#1f2933">Aunque no hagas la renta, el 303 del trimestre se presenta igual. A un particular normalmente no se le retiene IRPF.</text></svg>