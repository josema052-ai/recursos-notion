<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="640" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Caída de tensión en la línea del jacuzzi</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Cobre, 230 V, 25 m de cable · en vivienda el máximo es 3 % = 6,9 V (REBT, ITC-BT-19) · el 5 % no vale para vivienda</text><text class="f" x="40" y="142" font-size="17" font-weight="700" fill="#1f2933">A 20 A, en 25 m:</text><line x1="717.5" y1="148" x2="717.5" y2="360" stroke="#1f2933" stroke-width="2" stroke-dasharray="7 6"/><text class="f" x="717.5" y="142" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">límite 6,9 V (3 %)</text><text class="f" x="40" y="190" font-size="20" font-weight="700" fill="#1f2933">2,5 mm²</text><rect x="200" y="160" width="682.5" height="44" rx="6" fill="#d1342f" stroke="#d1342f" stroke-width="2"/><text class="f" x="896.5" y="189" font-size="17" font-weight="700" fill="#d1342f">9,1 V · 3,95 % · no cumple</text><text class="f" x="40" y="254" font-size="20" font-weight="700" fill="#1f2933">4 mm²</text><rect x="200" y="224" width="427.5" height="44" rx="6" fill="#2f855a" stroke="#2f855a" stroke-width="2"/><text class="f" x="731.5" y="253" font-size="17" font-weight="700" fill="#2f855a">5,7 V · 2,47 % · cumple</text><text class="f" x="40" y="318" font-size="20" font-weight="700" fill="#1f2933">6 mm²</text><rect x="200" y="288" width="285.0" height="44" rx="6" fill="#2f855a" stroke="#2f855a" stroke-width="2"/><text class="f" x="731.5" y="317" font-size="17" font-weight="700" fill="#2f855a">3,8 V · 1,65 % · cumple de sobra</text><text class="f" x="40" y="396" font-size="18" font-weight="700" fill="#1f2933">Largo máximo para no pasar del 3 %</text><rect x="40" y="410" width="130" height="38" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="105.0" y="435" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Sección</text><rect x="170" y="410" width="130" height="38" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="235.0" y="435" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">a 13 A</text><rect x="300" y="410" width="130" height="38" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="365.0" y="435" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">a 16 A</text><rect x="430" y="410" width="130" height="38" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="495.0" y="435" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">a 20 A</text><rect x="560" y="410" width="130" height="38" rx="0" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="625.0" y="435" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">a 25 A</text><rect x="40" y="448" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="105.0" y="473" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">2,5 mm²</text><rect x="170" y="448" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="235.0" y="473" font-size="15" fill="#1f2933" text-anchor="middle">29 m</text><rect x="300" y="448" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="365.0" y="473" font-size="15" fill="#1f2933" text-anchor="middle">24 m</text><rect x="430" y="448" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="495.0" y="473" font-size="15" fill="#1f2933" text-anchor="middle">19 m</text><rect x="560" y="448" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="625.0" y="473" font-size="15" fill="#1f2933" text-anchor="middle">—</text><rect x="40" y="486" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="105.0" y="511" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">4 mm²</text><rect x="170" y="486" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="235.0" y="511" font-size="15" fill="#1f2933" text-anchor="middle">47 m</text><rect x="300" y="486" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="365.0" y="511" font-size="15" fill="#1f2933" text-anchor="middle">38 m</text><rect x="430" y="486" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="495.0" y="511" font-size="15" fill="#1f2933" text-anchor="middle">30 m</text><rect x="560" y="486" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="625.0" y="511" font-size="15" fill="#1f2933" text-anchor="middle">24 m</text><rect x="40" y="524" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="105.0" y="549" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">6 mm²</text><rect x="170" y="524" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="235.0" y="549" font-size="15" fill="#1f2933" text-anchor="middle">70 m</text><rect x="300" y="524" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="365.0" y="549" font-size="15" fill="#1f2933" text-anchor="middle">57 m</text><rect x="430" y="524" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="495.0" y="549" font-size="15" fill="#1f2933" text-anchor="middle">45 m</text><rect x="560" y="524" width="130" height="38" rx="0" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="625.0" y="549" font-size="15" fill="#1f2933" text-anchor="middle">36 m</text><rect x="760" y="380" width="600" height="230" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="780" y="414" font-size="18" font-weight="700" fill="#2563eb">Cómo se calcula</text><text class="f" x="780" y="452" font-size="24" font-weight="700" fill="#1f2933">e = 2 · L · I / (γ · S)</text><text class="f" x="780" y="486" font-size="15" fill="#1f2933">L = metros de cable · I = amperios · S = sección (mm²)</text><text class="f" x="780" y="510" font-size="15" fill="#1f2933">γ = 44 (cobre a 70 °C)</text><text class="f" x="780" y="534" font-size="15" fill="#1f2933">Ejemplo: 2 · 25 · 20 / (44 · 2,5) = 9,1 V → 9,1 / 230 = 3,95 %</text><text class="f" x="780" y="594" font-size="14" fill="#5f6b7a">La caída es calidad de suministro; lo que calienta el cable es la corriente.</text></svg>