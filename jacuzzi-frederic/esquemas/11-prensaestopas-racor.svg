<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="660" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Prensaestopas o racor: qué sujeta cada uno</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Entradas a la caja de paso del escalón (notas del 07/10/2026)</text><rect x="40" y="110" width="410" height="330" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="60" y="145" font-size="19" font-weight="700" fill="#1f2933">Prensaestopas M25 / M32</text><rect x="100" y="190" width="70" height="90" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="170" y="205" width="40" height="60" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><path d="M210,205 Q250,235 210,265 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><line x1="50" y1="235" x2="400" y2="235" stroke="#2f855a" stroke-width="22"/><text class="f" x="60" y="330" font-size="16" font-weight="700" fill="#2f855a">Aprieta un CABLE redondo.</text><text class="f" x="60" y="358" font-size="15" fill="#1f2933">M32: para cable de Ø18-25 mm.</text><text class="f" x="60" y="379" font-size="15" fill="#1f2933">No sujeta un tubo de Ø32 por fuera.</text><text class="f" x="60" y="400" font-size="15" fill="#1f2933">Agujero: escalón de 26 mm (M25) o</text><text class="f" x="60" y="421" font-size="15" fill="#1f2933">32 mm (M32, pide ≈ 32,5: limar).</text><rect x="495" y="110" width="410" height="330" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="515" y="145" font-size="19" font-weight="700" fill="#1f2933">Racor tubo-caja Ø32 (rosca M32)</text><rect x="540" y="190" width="200" height="70" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/><rect x="740" y="180" width="50" height="90" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="790" y="200" width="30" height="50" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/><rect x="820" y="190" width="18" height="70" rx="2" fill="#475569" stroke="#334155" stroke-width="2"/><text class="f" x="829" y="285" font-size="13" fill="#5f6b7a" text-anchor="middle">contratuerca</text><text class="f" x="515" y="330" font-size="16" font-weight="700" fill="#2563eb">Sujeta un TUBO de Ø32.</text><text class="f" x="515" y="358" font-size="15" fill="#1f2933">Con contratuerca por dentro de la caja.</text><text class="f" x="515" y="379" font-size="15" fill="#1f2933">Mejor LH enchufable.</text><text class="f" x="515" y="400" font-size="15" fill="#1f2933">Agujero de ≈ 32,5 mm: escalonada</text><text class="f" x="515" y="421" font-size="15" fill="#1f2933">y después lima.</text><rect x="950" y="110" width="410" height="330" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="970" y="145" font-size="19" font-weight="700" fill="#1f2933">La caja del escalón</text><rect x="1050" y="175" width="220" height="150" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text class="f" x="1160" y="255" font-size="15" fill="#5f6b7a" text-anchor="middle">caja IP65</text><rect x="975" y="215" width="75" height="34" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="2"/><text class="f" x="1012" y="205" font-size="13" font-weight="700" fill="#1f2933" text-anchor="middle">Ø32</text><rect x="1135" y="325" width="50" height="50" rx="3" fill="#d1342f" stroke="#9b2c2c" stroke-width="2"/><text class="f" x="1195" y="360" font-size="13" font-weight="700" fill="#1f2933">Ø50 abajo</text><text class="f" x="970" y="405" font-size="14" fill="#1f2933">El racor Ø50 (rosca M50) no cabe en la</text><text class="f" x="970" y="425" font-size="14" fill="#1f2933">caja de 65 mm: usar la de 220×170×80 mm.</text><rect x="40" y="470" width="1320" height="160" rx="10" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/><text class="f" x="60" y="504" font-size="17" font-weight="700" fill="#a16207">Broca escalonada de titanio HSS 4-32 mm, vástago hexagonal (2,89 €, AliExpress, 07/10)</text><rect x="70" y="555.0" width="38" height="10.0" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="108" y="551.3" width="38" height="17.3" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="146" y="547.6" width="38" height="24.6" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="184" y="544.0" width="38" height="32.0" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="222" y="540.3" width="38" height="39.3" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="260" y="536.6" width="38" height="46.6" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="298" y="533.0" width="38" height="54.0" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><rect x="336" y="529.3" width="38" height="61.3" rx="2" fill="#d4af37" stroke="#a17f1a" stroke-width="2"/><text class="f" x="420" y="538" font-size="15" fill="#1f2933">Sin percusión, a velocidad baja, con agujero guía de 4 mm antes; quitar rebabas al terminar.</text><text class="f" x="420" y="562" font-size="15" fill="#1f2933">Corta bien chapa y plástico fino (la caja). No sirve para madera gruesa: para el cajón,</text><text class="f" x="420" y="586" font-size="15" fill="#1f2933">broca de pala de 25 y 32 mm o sierra de corona.</text></svg>