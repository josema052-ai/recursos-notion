<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="640" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Tubo para enterrar: qué diámetro y qué resistencia</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">ITC-BT-21, tubos enterrados (UNE-EN 50086-2-4 / 61386-24) · Tabla 9, menos de 6 conductores · tabla leída de una copia: verificar en el BOE</text><circle cx="200" cy="270" r="51.2" fill="#fde8e8" stroke="#d1342f" stroke-width="6"/><circle cx="200" cy="270" r="41.2" fill="#ffffff" stroke="#f3b4b4" stroke-width="2"/><text class="f" x="200" y="361.2" font-size="22" font-weight="700" fill="#1f2933" text-anchor="middle">Ø32 mm</text><text class="f" x="200" y="385.2" font-size="15" fill="#5f6b7a" text-anchor="middle">para cable de 2,5 mm²</text><circle cx="500" cy="270" r="64.0" fill="#fde8e8" stroke="#d1342f" stroke-width="6"/><circle cx="500" cy="270" r="54.0" fill="#ffffff" stroke="#f3b4b4" stroke-width="2"/><text class="f" x="500" y="374.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="middle">Ø40 mm</text><text class="f" x="500" y="398.0" font-size="15" fill="#5f6b7a" text-anchor="middle">para cable de 4 mm²</text><circle cx="800" cy="270" r="80.0" fill="#fde8e8" stroke="#d1342f" stroke-width="6"/><circle cx="800" cy="270" r="70.0" fill="#ffffff" stroke="#f3b4b4" stroke-width="2"/><text class="f" x="800" y="390.0" font-size="22" font-weight="700" fill="#1f2933" text-anchor="middle">Ø50 mm</text><text class="f" x="800" y="414.0" font-size="15" fill="#5f6b7a" text-anchor="middle">para cable de 6 mm²</text><circle cx="500" cy="282" r="22.4" fill="#2f855a" stroke="#22543d" stroke-width="2"/><text class="f" x="500" y="170" font-size="13" font-weight="700" fill="#2f855a" text-anchor="middle">3G6 ≈ 13-15 mm</text><text class="f" x="500" y="186" font-size="13" fill="#2f855a" text-anchor="middle">dentro de ≈ 34 mm útiles</text><rect x="930" y="120" width="430" height="150" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="948" y="152" font-size="18" font-weight="700" fill="#2563eb">Resistencia a la compresión</text><text class="f" x="948" y="182" font-size="15" fill="#1f2933">Jardín (suelo ligero): 450 N o más</text><text class="f" x="948" y="204" font-size="15" fill="#1f2933">Suelo pesado: 750 N o más</text><text class="f" x="948" y="226" font-size="15" fill="#1f2933">Míralo en «Características» de la ficha</text><text class="f" x="948" y="248" font-size="15" fill="#1f2933">o en la etiqueta del rollo.</text><rect x="930" y="285" width="430" height="105" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="948" y="316" font-size="18" font-weight="700" fill="#d1342f">No vale para enterrar</text><text class="f" x="948" y="344" font-size="15" fill="#1f2933">REVI corrugado reforzado negro 20 mm:</text><text class="f" x="948" y="366" font-size="15" fill="#1f2933">320 N, para empotrar (ref. 25114919).</text><rect x="930" y="405" width="430" height="130" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="948" y="436" font-size="18" font-weight="700" fill="#2f855a">Candidato (Obramat, 14/10)</text><text class="f" x="948" y="464" font-size="15" fill="#1f2933">REVI doble capa rojo 40 mm × 50 m, 450 N,</text><text class="f" x="948" y="486" font-size="15" fill="#1f2933">15 J (ref. 10037041, 39,68 €). Vale para 3G4;</text><text class="f" x="948" y="508" font-size="15" fill="#1f2933">para 3G6 la tabla pide 50 mm.</text><rect x="40" y="520" width="860" height="90" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="58" y="552" font-size="15" fill="#1f2933">El 3G6 cabe físicamente en el de 40 mm (incluso dos cables). La duda es solo normativa: la tabla pide</text><text class="f" x="58" y="576" font-size="15" fill="#1f2933">50 mm exteriores para 6 mm². Lo decide la empresa instaladora que firme.</text></svg>