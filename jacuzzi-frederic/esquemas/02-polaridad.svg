<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="600" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Polaridad: comprobar la fase antes de conectar el jacuzzi</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">Multímetro en V~ (alterna) · línea con tensión y el extremo del jacuzzi suelto, cada hilo con capuchón · una persona, una mano</text><line x1="60" y1="170" x2="330" y2="170" stroke="#8b5a2b" stroke-width="14"/><circle cx="342" cy="170" r="9" fill="#c0c0c0" stroke="#888" stroke-width="2"/><text class="f" x="60" y="156" font-size="15" font-weight="700" fill="#8b5a2b">Fase (L) · marrón</text><line x1="60" y1="240" x2="330" y2="240" stroke="#2b6cb0" stroke-width="14"/><circle cx="342" cy="240" r="9" fill="#c0c0c0" stroke="#888" stroke-width="2"/><text class="f" x="60" y="226" font-size="15" font-weight="700" fill="#2b6cb0">Neutro (N) · azul</text><line x1="60" y1="310" x2="330" y2="310" stroke="#2f855a" stroke-width="14"/><line x1="60" y1="310" x2="330" y2="310" stroke="#ecc94b" stroke-width="14" stroke-dasharray="18 18"/><circle cx="342" cy="310" r="9" fill="#c0c0c0" stroke="#888" stroke-width="2"/><text class="f" x="60" y="296" font-size="15" font-weight="700" fill="#2f855a">Tierra (PE) · verde-amarillo</text><text class="f" x="60" y="380" font-size="14" fill="#5f6b7a">Viene del C20 del cuadro (25 m de 3G2,5)</text><rect x="420" y="140" width="470" height="250" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="440" y="174" font-size="18" font-weight="700" fill="#1f2933">Qué tiene que marcar</text><rect x="440" y="192" width="430" height="42" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="456" y="220" font-size="16" fill="#1f2933">marrón  ↔  azul</text><text class="f" x="850" y="220" font-size="18" font-weight="700" fill="#2563eb" text-anchor="end">≈ 230 V</text><rect x="440" y="244" width="430" height="42" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="456" y="272" font-size="16" fill="#1f2933">marrón  ↔  verde-amarillo</text><text class="f" x="850" y="272" font-size="18" font-weight="700" fill="#2563eb" text-anchor="end">≈ 230 V</text><rect x="440" y="296" width="430" height="42" rx="8" fill="#ffffff" stroke="#c9d1db" stroke-width="2"/><text class="f" x="456" y="324" font-size="16" fill="#1f2933">azul  ↔  verde-amarillo</text><text class="f" x="850" y="324" font-size="18" font-weight="700" fill="#2563eb" text-anchor="end">≈ 0 V</text><text class="f" x="440" y="376" font-size="14" font-weight="700" fill="#1f2933">El hilo que da 230 V contra tierra es la fase: debe ser el marrón.</text><rect x="930" y="140" width="420" height="120" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="948" y="172" font-size="18" font-weight="700" fill="#d1342f">Si sale al revés</text><text class="f" x="948" y="200" font-size="15" fill="#1f2933">Bajar el C20, corregir en el cuadro y volver</text><text class="f" x="948" y="221" font-size="15" fill="#1f2933">a medir antes de conectar el jacuzzi. Fase en</text><text class="f" x="948" y="242" font-size="15" fill="#1f2933">el borne N estropea la caja de control.</text><rect x="930" y="275" width="420" height="115" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="948" y="307" font-size="18" font-weight="700" fill="#2f855a">Forma más fácil (en el cuadro)</text><text class="f" x="948" y="335" font-size="15" fill="#1f2933">General subido y nada conectado: medir cada</text><text class="f" x="948" y="356" font-size="15" fill="#1f2933">salida del general contra tierra. La que da</text><text class="f" x="948" y="377" font-size="15" fill="#1f2933">230 V es la fase: ahí va el marrón.</text><rect x="60" y="430" width="1290" height="130" rx="10" fill="#fff7d6" stroke="#d4a72c" stroke-width="2"/><text class="f" x="80" y="464" font-size="18" font-weight="700" fill="#a16207">Por qué medir si los colores ya dicen cuál es cuál</text><text class="f" x="80" y="494" font-size="15" fill="#1f2933">Los colores del cable son fiables de punta a punta, pero no dicen si la fase del cuadro está en la borna donde toca</text><text class="f" x="80" y="516" font-size="15" fill="#1f2933">(una línea puede estar cableada al revés) ni si te has equivocado al conectar. Son 2 minutos, una sola vez.</text><text class="f" x="80" y="538" font-size="15" fill="#1f2933">Un alargador no sirve para esto: no dice cuál es la fase. Un detector de tensión sin contacto (2-5 €) sí ayuda.</text></svg>