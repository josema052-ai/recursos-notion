<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="700" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933">Conectar el jacuzzi: lo que pide el fabricante</text><text class="f" x="40" y="84" font-size="17" fill="#5f6b7a">HotSpring Envoy (KKE) · manual «2024 Highlife 50Hz Owner's Manual», apartado Electrical Requirements · revisado el 06/10/2026</text><rect x="40" y="120" width="640" height="120" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="58" y="154" font-size="19" font-weight="700" fill="#2f855a">1. Monofásico 230 V, 3 hilos</text><text class="f" x="58" y="186" font-size="16" fill="#1f2933">Fase, neutro y tierra. El Envoy está</text><text class="f" x="58" y="210" font-size="16" fill="#1f2933">entre los modelos de 20 A.</text><rect x="550" y="134" width="68" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="584.0" y="152.0" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Cumple</text><rect x="720" y="120" width="640" height="120" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="738" y="154" font-size="19" font-weight="700" fill="#2f855a">2. Colores</text><text class="f" x="738" y="186" font-size="16" fill="#1f2933">Fase marrón · neutro azul ·</text><text class="f" x="738" y="210" font-size="16" fill="#1f2933">tierra verde-amarilla.</text><rect x="1230" y="134" width="68" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1264.0" y="152.0" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Cumple</text><rect x="40" y="260" width="640" height="120" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><text class="f" x="58" y="294" font-size="19" font-weight="700" fill="#a16207">3. Tierra tan gruesa como la fase</text><text class="f" x="58" y="326" font-size="16" fill="#1f2933">Mínimo 4 mm² en los de 20 A.</text><text class="f" x="58" y="350" font-size="16" fill="#1f2933">El 3G6 cumplía; el 3G2,5 montado lleva 2,5 mm².</text><rect x="550" y="274" width="76" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="588.0" y="292.0" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">Revisar</text><rect x="720" y="260" width="640" height="120" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="738" y="294" font-size="19" font-weight="700" fill="#2f855a">4. Diferencial de 30 mA como máximo</text><text class="f" x="738" y="326" font-size="16" fill="#1f2933">Tu diferencial es de 30 mA tipo F</text><text class="f" x="738" y="350" font-size="16" fill="#1f2933">(cubre al tipo A).</text><rect x="1230" y="274" width="68" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1264.0" y="292.0" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">Cumple</text><rect x="40" y="400" width="640" height="120" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><text class="f" x="58" y="434" font-size="19" font-weight="700" fill="#a16207">5. Corte general: 3 mm entre contactos</text><text class="f" x="58" y="466" font-size="16" fill="#1f2933">Interruptor de 2 polos con separación</text><text class="f" x="58" y="490" font-size="16" fill="#1f2933">de contactos ≥ 3 mm. Mirar la ficha.</text><rect x="550" y="414" width="93" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="596.5" y="432.0" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">Comprobar</text><rect x="720" y="400" width="640" height="120" rx="10" fill="#fff7d6" stroke="#a16207" stroke-width="2"/><text class="f" x="738" y="434" font-size="19" font-weight="700" fill="#a16207">6. Equipotencial</text><text class="f" x="738" y="466" font-size="16" fill="#1f2933">Cobre de 6 mm² a piezas metálicas a</text><text class="f" x="738" y="490" font-size="16" fill="#1f2933">menos de 1,5 m. Si solo hay madera y plástico, seguramente no.</text><rect x="1230" y="414" width="84" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1272.0" y="432.0" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">Ver allí</text><rect x="40" y="540" width="640" height="120" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="58" y="574" font-size="19" font-weight="700" fill="#2563eb">7. Bornero de la caja de control</text><text class="f" x="58" y="606" font-size="16" fill="#1f2933">Trae puentes de fábrica:</text><text class="f" x="58" y="630" font-size="16" fill="#1f2933">dejarlos como vienen.</text><rect x="550" y="554" width="44" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="572.0" y="572.0" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Ojo</text><rect x="720" y="540" width="640" height="120" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="738" y="574" font-size="19" font-weight="700" fill="#d1342f">8. Fase en el borne del neutro</text><text class="f" x="738" y="606" font-size="16" fill="#1f2933">Estropea la caja de control sin arreglo.</text><text class="f" x="738" y="630" font-size="16" fill="#1f2933">Medir la polaridad antes de apretar.</text><rect x="1230" y="554" width="76" height="26" rx="13.0" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text class="f" x="1268.0" y="572.0" font-size="14" font-weight="700" fill="#d1342f" text-anchor="middle">Peligro</text></svg>