<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect width="1400" height="860" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Unión equipotencial: qué es y a qué se conecta</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Vista desde arriba · manual HotSpring (instrucciones de seguridad): metal a menos de 1,5 m del spa → cobre macizo de 6 mm² al borne de la caja de control</text><rect x="423.0" y="94.5" width="554" height="531" rx="40" fill="#fff8e6" stroke="#b7791f" stroke-width="3" stroke-dasharray="10 8"/><text class="f" x="437.0" y="122.5" font-size="16" font-weight="700" fill="#b7791f" text-anchor="start">Zona de 1,5 m alrededor del spa</text><rect x="573.0" y="244.5" width="254" height="231" rx="24" fill="#e8f0f9" stroke="#2b6cb0" stroke-width="4"/><text class="f" x="700" y="354" font-size="26" font-weight="700" fill="#2b6cb0" text-anchor="middle">Jacuzzi</text><text class="f" x="700" y="382" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="middle">caja de control</text><rect x="771.0" y="433.5" width="64" height="32" rx="6" fill="#ffffff" stroke="#2f855a" stroke-width="3"/><text class="f" x="803.0" y="454.5" font-size="13" font-weight="700" fill="#2f855a" text-anchor="middle">PE 6</text><line x1="922.0" y1="260" x2="922.0" y2="440" stroke="#6b7785" stroke-width="12" stroke-linecap="round"/><text class="f" x="942.0" y="256" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Barandilla</text><text class="f" x="942.0" y="274" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">metálica</text><line x1="835.0" y1="449.5" x2="916.0" y2="449.5" stroke="#2f855a" stroke-width="5" stroke-linecap="round"/><circle cx="922.0" cy="449.5" r="9" fill="#2f855a"/><line x1="478.0" y1="240" x2="478.0" y2="400" stroke="#6b7785" stroke-width="12" stroke-linecap="round"/><text class="f" x="458.0" y="236" font-size="15" font-weight="700" fill="#1f2933" text-anchor="end">Tubería de agua</text><text class="f" x="458.0" y="254" font-size="15" font-weight="700" fill="#1f2933" text-anchor="end">metálica</text><polyline points="771.0,459.5 771.0,509.5 478.0,509.5 478.0,400" fill="none" stroke="#2f855a" stroke-width="5" stroke-linejoin="round"/><circle cx="478.0" cy="400" r="9" fill="#2f855a"/><rect x="630" y="144.5" width="140" height="36" rx="4" fill="#cfd6de" stroke="#6b7785" stroke-width="3"/><text class="f" x="700" y="168.5" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Caja metálica</text><polyline points="700,180.5 700,244.5" fill="none" stroke="#2f855a" stroke-width="5"/><rect x="60" y="170" width="200" height="56" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="3"/><text class="f" x="160" y="196" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">Valla de madera</text><text class="f" x="160" y="216" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">no hace falta</text><rect x="1140" y="170" width="200" height="56" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="3"/><text class="f" x="1240" y="196" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">Tubo de PVC / plástico</text><text class="f" x="1240" y="216" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">no hace falta</text><rect x="1140" y="560" width="200" height="56" rx="6" fill="#ffffff" stroke="#d1342f" stroke-width="3"/><text class="f" x="1240" y="586" font-size="15" font-weight="700" fill="#d1342f" text-anchor="middle">Metal a 2 m</text><text class="f" x="1240" y="606" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">fuera de zona: no hace falta</text><rect x="40" y="650" width="430" height="170" rx="10" fill="#ffffff" stroke="#2f855a" stroke-width="3"/><text class="f" x="56" y="682" font-size="19" font-weight="700" fill="#2f855a" text-anchor="start">Qué es</text><text class="f" x="56" y="712" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Un cable de cobre que une todas las piezas metálicas</text><text class="f" x="56" y="736" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">que se pueden tocar a la vez, para que estén al</text><text class="f" x="56" y="760" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">mismo potencial. Si hay una avería, ninguna queda</text><text class="f" x="56" y="784" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">más “cargada” que otra y no pasa corriente por ti al</text><text class="f" x="56" y="808" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">tocar dos.</text><rect x="490" y="650" width="430" height="170" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="506" y="682" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">Qué NO es</text><text class="f" x="506" y="712" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">No es el hilo de tierra (verde-amarillo) de la</text><text class="f" x="506" y="736" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">manguera de alimentación: es un cable extra, de</text><text class="f" x="506" y="760" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">cobre macizo de 6 mm², al borne de unión (PE) de la</text><text class="f" x="506" y="784" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">caja de control.</text><rect x="940" y="650" width="430" height="170" rx="10" fill="#ffffff" stroke="#b7791f" stroke-width="3"/><text class="f" x="956" y="682" font-size="19" font-weight="700" fill="#b7791f" text-anchor="start">Qué hacer en la visita</text><text class="f" x="956" y="712" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Mirar si a menos de 1,5 m hay metal: barandillas,</text><text class="f" x="956" y="736" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">tuberías, vallas, estructura, armadura de la losa.</text><text class="f" x="956" y="760" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si no hay, no se pone. Si hay, una unión por pieza y</text><text class="f" x="956" y="784" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">apretar bien.</text></svg>