<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect width="1400" height="860" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Cómo medir la caída de tensión de la línea del jacuzzi</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Con el spa funcionando · cable 2,5 mm² de ≈ 29 m · dos medidas de tensión y una de intensidad (pinza)</text><rect x="60" y="200" width="200" height="150" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="160" y="232" font-size="17" font-weight="700" fill="#1f2933" text-anchor="middle">Cuadro de la casa</text><rect x="90" y="250" width="70" height="34" rx="4" fill="#f4f6f8" stroke="#1f2933" stroke-width="2"/><text class="f" x="125" y="272" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">C20</text><rect x="170" y="250" width="70" height="34" rx="4" fill="#f4f6f8" stroke="#1f2933" stroke-width="2"/><text class="f" x="205" y="272" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Dif.</text><text class="f" x="160" y="330" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">(no hace falta abrirlo)</text><rect x="60" y="420" width="200" height="70" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="3"/><text class="f" x="160" y="448" font-size="16" font-weight="700" fill="#2b6cb0" text-anchor="middle">Enchufe de la casa</text><text class="f" x="160" y="472" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">cerca del cuadro</text><line x1="160" y1="350" x2="160" y2="420" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="60" y="520" width="170" height="86" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="3"/><rect x="72" y="532" width="146" height="36" rx="5" fill="#e8f0f9" stroke="#2b6cb0" stroke-width="1.5"/><text class="f" x="145" y="559" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="middle">231,0 V</text><text class="f" x="145" y="592" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">V1 · casa</text><line x1="260" y1="275" x2="720" y2="275" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/><line x1="260" y1="291" x2="720" y2="291" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/><line x1="260" y1="307" x2="720" y2="307" stroke="#2f855a" stroke-width="4" stroke-linecap="round"/><text class="f" x="580" y="262" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">≈ 25 m de línea (2,5 mm²)</text><circle cx="400" cy="275" r="34" fill="none" stroke="#1f2933" stroke-width="7"/><line x1="400" y1="241" x2="400" y2="190" stroke="#1f2933" stroke-width="7"/><rect x="350" y="130" width="100" height="60" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="400" y="170" font-size="22" font-weight="700" fill="#1f2933" text-anchor="middle">7,8 A</text><text class="f" x="400" y="330" font-size="14" font-weight="700" fill="#8a5a2b" text-anchor="middle">pinza solo en</text><text class="f" x="400" y="348" font-size="14" font-weight="700" fill="#8a5a2b" text-anchor="middle">el hilo marrón</text><rect x="720" y="240" width="130" height="100" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="785" y="272" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Caja punto</text><text class="f" x="785" y="292" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">intermedio</text><text class="f" x="785" y="318" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">interruptor de corte</text><line x1="850" y1="275" x2="1130" y2="275" stroke="#8a5a2b" stroke-width="6" stroke-linecap="round"/><line x1="850" y1="291" x2="1130" y2="291" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/><line x1="850" y1="307" x2="1130" y2="307" stroke="#2f855a" stroke-width="4" stroke-linecap="round"/><text class="f" x="990" y="262" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">3-4 m</text><rect x="1130" y="210" width="210" height="130" rx="16" fill="#e8f0f9" stroke="#2b6cb0" stroke-width="3"/><text class="f" x="1235" y="262" font-size="22" font-weight="700" fill="#2b6cb0" text-anchor="middle">Jacuzzi</text><text class="f" x="1235" y="288" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">bornero (o base exterior)</text><rect x="1150" y="360" width="170" height="86" rx="10" fill="#ffffff" stroke="#2b6cb0" stroke-width="3"/><rect x="1162" y="372" width="146" height="36" rx="5" fill="#e8f0f9" stroke="#2b6cb0" stroke-width="1.5"/><text class="f" x="1235" y="399" font-size="20" font-weight="700" fill="#2b6cb0" text-anchor="middle">226,9 V</text><text class="f" x="1235" y="432" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">V2 · extremo del spa</text><line x1="1235" y1="340" x2="1235" y2="360" stroke="#2b6cb0" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="40" y="630" width="320" height="190" rx="10" fill="#ffffff" stroke="#5f6b7a" stroke-width="3"/><text class="f" x="56" y="662" font-size="19" font-weight="700" fill="#5f6b7a" text-anchor="start">1 · Spa parado</text><text class="f" x="56" y="692" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Mide V1 y V2 sin carga. Deben</text><text class="f" x="56" y="716" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">coincidir (±1 V). Si no, hay un</text><text class="f" x="56" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">problema aparte o una mala</text><text class="f" x="56" y="764" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">medida.</text><rect x="380" y="630" width="320" height="190" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="396" y="662" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">2 · Spa en marcha</text><text class="f" x="396" y="692" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Calentador + bombas en alta.</text><text class="f" x="396" y="716" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Apunta a la vez V1, V2 y los</text><text class="f" x="396" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">amperios (pinza). Lo mejor: dos</text><text class="f" x="396" y="764" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">polímetros a la vez.</text><rect x="720" y="630" width="320" height="190" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text class="f" x="736" y="662" font-size="19" font-weight="700" fill="#1f2933" text-anchor="start">3 · La cuenta</text><text class="f" x="736" y="692" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Caída ΔV = V1 − V2. Resistencia R</text><text class="f" x="736" y="716" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">= ΔV ÷ amperios. Ejemplo: 231,0 −</text><text class="f" x="736" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">226,9 = 4,1 V; 4,1 ÷ 8 = 0,51 Ω.</text><rect x="1060" y="630" width="320" height="190" rx="10" fill="#ffffff" stroke="#d1342f" stroke-width="3"/><text class="f" x="1076" y="662" font-size="19" font-weight="700" fill="#d1342f" text-anchor="start">4 · Límites</text><text class="f" x="1076" y="692" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Caída máxima 3 % = 6,9 V.</text><text class="f" x="1076" y="716" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Fabricante: el spa pide 240 V ±10</text><text class="f" x="1076" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">% → V2 no debe bajar de 216 V.</text></svg>