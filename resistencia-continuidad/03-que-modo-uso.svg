<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="780" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">¿Qué modo uso? Empieza por la pregunta, no por el aparato</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Siempre sin tensión para Ω y continuidad: magnetotérmico bajado y comprobado con el bipolar</text><rect x="40" y="120" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="152" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Están unidos estos dos puntos?</text><text class="f" x="64" y="176" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Sí o no, rápido. Identificar cables,</text><text class="f" x="64" y="196" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">fusible, interruptor, puente.</text><path d="M690,164.0 L780,164.0" stroke="#2f855a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,155.0 L781,164.0 L768,173.0" stroke="#2f855a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="120" width="570" height="88" rx="10" fill="#e6f4ec" stroke="#2f855a" stroke-width="2.5"/><text class="f" x="814" y="158" font-size="20" font-weight="700" fill="#2f855a" text-anchor="start">CONTINUIDAD ·)))</text><text class="f" x="814" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">pita = unido · silencio = cortado</text><rect x="40" y="224" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="256" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Cómo de bien unidos? ¿Cuánto vale?</text><text class="f" x="64" y="280" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Cable largo, empalme dudoso,</text><text class="f" x="64" y="300" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">resistencia de termo, motor, sonda.</text><path d="M690,268.0 L780,268.0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,259.0 L781,268.0 L768,277.0" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="224" width="570" height="88" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2.5"/><text class="f" x="814" y="262" font-size="20" font-weight="700" fill="#2563eb" text-anchor="start">RESISTENCIA Ω</text><text class="f" x="814" y="290" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">lees el número y lo comparas</text><rect x="40" y="328" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="360" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Hay un falso contacto que va y viene?</text><text class="f" x="64" y="384" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Menear el cable o el borne</text><text class="f" x="64" y="404" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">mientras mides.</text><path d="M690,372.0 L780,372.0" stroke="#2f855a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,363.0 L781,372.0 L768,381.0" stroke="#2f855a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="328" width="570" height="88" rx="10" fill="#e6f4ec" stroke="#2f855a" stroke-width="2.5"/><text class="f" x="814" y="366" font-size="20" font-weight="700" fill="#2f855a" text-anchor="start">CONTINUIDAD ·)))</text><text class="f" x="814" y="394" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">reacciona en &lt; 4 ms; Ω tarda ~2,6 s</text><rect x="40" y="432" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="464" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Está bien el aislamiento? ¿Hay fuga?</text><text class="f" x="64" y="488" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Fase o neutro contra tierra,</text><text class="f" x="64" y="508" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">cable suelto en los dos extremos.</text><path d="M690,476.0 L780,476.0" stroke="#6b46c1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,467.0 L781,476.0 L768,485.0" stroke="#6b46c1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="432" width="570" height="88" rx="10" fill="#f1ecfb" stroke="#6b46c1" stroke-width="2.5"/><text class="f" x="814" y="470" font-size="20" font-weight="700" fill="#6b46c1" text-anchor="start">MEGÓHMETRO 500 V</text><text class="f" x="814" y="498" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">mínimo 0,5 MΩ · sano &gt; 100 MΩ</text><rect x="40" y="536" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="568" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Falla solo cuando hay carga?</text><text class="f" x="64" y="592" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Borne que calienta, luz que</text><text class="f" x="64" y="612" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">baja al encender algo.</text><path d="M690,580.0 L780,580.0" stroke="#c26a00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,571.0 L781,580.0 L768,589.0" stroke="#c26a00" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="536" width="570" height="88" rx="10" fill="#fff4e0" stroke="#c26a00" stroke-width="2.5"/><text class="f" x="814" y="574" font-size="20" font-weight="700" fill="#c26a00" text-anchor="start">VOLTIOS CON CARGA</text><text class="f" x="814" y="602" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">caída en el borne &gt; 0,1 V a 10 A: sospecha</text><rect x="40" y="640" width="640" height="88" rx="10" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1.5"/><text class="f" x="64" y="672" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Hay tensión?</text><text class="f" x="64" y="696" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Antes de tocar nada.</text><path d="M690,684.0 L780,684.0" stroke="#d1342f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M768,675.0 L781,684.0 L768,693.0" stroke="#d1342f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="640" width="570" height="88" rx="10" fill="#fdecea" stroke="#d1342f" stroke-width="2.5"/><text class="f" x="814" y="678" font-size="20" font-weight="700" fill="#d1342f" text-anchor="start">BIPOLAR / V~</text><text class="f" x="814" y="706" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">nunca Ω ni continuidad con tensión</text></svg>