<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="650" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">La prueba del meneo: por qué para un falso contacto gana el pitido</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Mueves el cable o aprietas el borne mientras mides. El contacto se corta unas décimas de segundo.</text><text class="f" x="40" y="156" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Contacto real</text><text class="f" x="40" y="296" font-size="16" font-weight="700" fill="#2f855a" text-anchor="start">Pitido (UT210E: &lt; 4 ms)</text><text class="f" x="40" y="436" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">Pantalla en Ω</text><path d="M230.0,128 L477.5,128 L477.5,172 L518.75,172 L518.75,128 L697.5,128 L697.5,172 L719.5,172 L719.5,128 L945.0,128 L945.0,172 L1027.5,172 L1027.5,128 L1137.5,128 L1137.5,172 L1154.0,172 L1154.0,128 L1330.0,128" stroke="#1f2933" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="234.0" y="118" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">unido</text><text class="f" x="477.5" y="196" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">cortado</text><rect x="230.0" y="274" width="247.5" height="32" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><rect x="518.75" y="274" width="178.75" height="32" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><rect x="719.5" y="274" width="225.5" height="32" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><rect x="1027.5" y="274" width="110.0" height="32" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><rect x="1154.0" y="274" width="176.0" height="32" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="498.125" y="334" font-size="13" font-weight="700" fill="#d1342f" text-anchor="middle">corta</text><text class="f" x="708.5" y="334" font-size="13" font-weight="700" fill="#d1342f" text-anchor="middle">corta</text><text class="f" x="986.25" y="334" font-size="13" font-weight="700" fill="#d1342f" text-anchor="middle">corta</text><text class="f" x="1145.75" y="334" font-size="13" font-weight="700" fill="#d1342f" text-anchor="middle">corta</text><line x1="230.0" y1="404" x2="230.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="196.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="230.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="340.0" y1="404" x2="340.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="306.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="340.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="450.0" y1="404" x2="450.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="416.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="450.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="560.0" y1="404" x2="560.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="526.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="560.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="670.0" y1="404" x2="670.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="636.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="670.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="780.0" y1="404" x2="780.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="746.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="780.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="890.0000000000001" y1="404" x2="890.0000000000001" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="856.0000000000001" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="890.0000000000001" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="1000.0000000000001" y1="404" x2="1000.0000000000001" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="966.0000000000001" y="414" width="68" height="32" rx="6" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="1000.0000000000001" y="436" font-size="14" font-weight="700" fill="#d1342f" text-anchor="middle">OL</text><line x1="1110.0" y1="404" x2="1110.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="1076.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="1110.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="1220.0" y1="404" x2="1220.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="1186.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="1220.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><line x1="1330.0" y1="404" x2="1330.0" y2="456" stroke="#cbd2d9" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><rect x="1296.0" y="414" width="68" height="32" rx="6" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="1330.0" y="436" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">0,3</text><text class="f" x="230" y="520" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">La pantalla solo «mira» unas pocas veces por segundo y además el autorrango tarda en asentarse (UT210E: ~2,6 s para leer 100 Ω).</text><text class="f" x="230" y="544" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">La mayoría de cortes caen entre lectura y lectura: la cifra parece estable y das el cable por bueno.</text><rect x="40" y="568" width="1290" height="56" rx="10" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="64" y="603" font-size="17" font-weight="700" fill="#2f855a" text-anchor="start">Para buscar un falso contacto: modo continuidad, mira el cable (no la pantalla) y escucha. Pitido entrecortado = ahí está.</text><line x1="230" y1="470" x2="1330" y2="470" stroke="#cbd2d9" stroke-width="1" stroke-linecap="round"/><text class="f" x="230.0" y="488" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">0 s</text><text class="f" x="505.0" y="488" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">1 s</text><text class="f" x="780.0" y="488" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">2 s</text><text class="f" x="1055.0" y="488" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">3 s</text><text class="f" x="1330.0" y="488" font-size="12" font-weight="400" fill="#5f6b7a" text-anchor="middle">4 s</text></svg>