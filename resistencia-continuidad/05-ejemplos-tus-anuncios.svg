<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="1240" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Cuándo te sirve cada modo en tus 4 anuncios (y fuera de ellos)</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">·))) = continuidad (sí/no, pitido) · Ω = resistencia (número) · siempre sin tensión</text><rect x="40" y="120" width="640" height="470" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><rect x="40" y="120" width="640" height="56" rx="14" fill="#e8f0fe" stroke="none" stroke-width="0"/><rect x="40" y="160" width="640" height="16" rx="0" fill="#e8f0fe" stroke="none" stroke-width="0"/><line x1="40" y1="176" x2="680" y2="176" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><text class="f" x="64" y="158" font-size="22" font-weight="700" fill="#2563eb" text-anchor="start">Electricista</text><rect x="60" y="200" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="95" y="225" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="148" y="216" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Qué hilo es cuál en una manguera</text><text class="f" x="148" y="240" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">puente en un extremo; pita el par unido</text><rect x="60" y="278" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="95" y="303" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="148" y="294" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Tierra o neutro (cuadro sin tensión)</text><text class="f" x="148" y="318" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">contra barra de tierra: tierra pita, neutro OL</text><rect x="60" y="356" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="95" y="381" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="148" y="372" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Magnetotérmico desmontado</text><text class="f" x="148" y="396" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">ON pita · OFF OL</text><rect x="60" y="434" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="95" y="459" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="148" y="450" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Resistencia de termo o calentador</text><text class="f" x="148" y="474" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">1500 W ≈ 35,3 Ω · 2000 W ≈ 26,5 Ω</text><rect x="60" y="512" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="95" y="537" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="148" y="528" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Fuga de un cable suelto a tierra</text><text class="f" x="148" y="552" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">con multímetro: cualquier número ≠ OL es fuga</text><rect x="720" y="120" width="640" height="470" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/><rect x="720" y="120" width="640" height="56" rx="14" fill="#e6f6f4" stroke="none" stroke-width="0"/><rect x="720" y="160" width="640" height="16" rx="0" fill="#e6f6f4" stroke="none" stroke-width="0"/><line x1="720" y1="176" x2="1360" y2="176" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><text class="f" x="744" y="158" font-size="22" font-weight="700" fill="#0f766e" text-anchor="start">Red / RJ45</text><rect x="740" y="200" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="225" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="216" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Los 8 hilos de punta a punta</text><text class="f" x="828" y="240" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">uno a uno, o con el tester de red</text><rect x="740" y="278" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="303" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="294" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Cortocircuito entre hilos</text><text class="f" x="828" y="318" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">entre dos hilos distintos: NUNCA debe pitar</text><rect x="740" y="356" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="775" y="381" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="828" y="372" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Crimpado dudoso</text><text class="f" x="828" y="396" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">compara los 8: el que da varios Ω más, mal</text><rect x="740" y="434" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="775" y="459" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="828" y="450" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Lazo de un par Cat6</text><text class="f" x="828" y="474" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">≈ 0,19 Ω por metro de cable (30 m ≈ 5,6 Ω)</text><rect x="740" y="512" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="537" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="528" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Roseta de teléfono a reaprovechar</text><text class="f" x="828" y="552" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">qué par llega a qué caja</text><rect x="40" y="610" width="640" height="470" rx="14" fill="#ffffff" stroke="#6b46c1" stroke-width="2.5"/><rect x="40" y="610" width="640" height="56" rx="14" fill="#f1ecfb" stroke="none" stroke-width="0"/><rect x="40" y="650" width="640" height="16" rx="0" fill="#f1ecfb" stroke="none" stroke-width="0"/><line x1="40" y1="666" x2="680" y2="666" stroke="#6b46c1" stroke-width="2" stroke-linecap="round"/><text class="f" x="64" y="648" font-size="22" font-weight="700" fill="#6b46c1" text-anchor="start">Domótica</text><rect x="60" y="690" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="95" y="715" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="148" y="706" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Sensor magnético de puerta</text><text class="f" x="148" y="730" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">imán cerca pita · lejos OL (o al revés si es NC)</text><rect x="60" y="768" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="95" y="793" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="148" y="784" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Motor tubular de persiana</text><text class="f" x="148" y="808" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">común–subida ≈ común–bajada; OL = final de carrera</text><rect x="60" y="846" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="95" y="871" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="148" y="862" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Sonda NTC 10 kΩ del termostato</text><text class="f" x="148" y="886" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">10 kΩ a 25 °C; baja al calentarla</text><rect x="60" y="924" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="95" y="949" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="148" y="940" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Pulsador o interruptor de persiana</text><text class="f" x="148" y="964" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">común–subida pita solo al pulsar</text><rect x="60" y="1002" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="95" y="1027" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="148" y="1018" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">¡Ojo con la NTC!</text><text class="f" x="148" y="1042" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">si la coges con los dedos: paralelo + calor</text><rect x="720" y="610" width="640" height="470" rx="14" fill="#ffffff" stroke="#c26a00" stroke-width="2.5"/><rect x="720" y="610" width="640" height="56" rx="14" fill="#fff4e0" stroke="none" stroke-width="0"/><rect x="720" y="650" width="640" height="16" rx="0" fill="#fff4e0" stroke="none" stroke-width="0"/><line x1="720" y1="666" x2="1360" y2="666" stroke="#c26a00" stroke-width="2" stroke-linecap="round"/><text class="f" x="744" y="648" font-size="22" font-weight="700" fill="#c26a00" text-anchor="start">Manitas</text><rect x="740" y="690" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="715" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="706" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Alargador, regleta, lámpara</text><text class="f" x="828" y="730" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">cada hilo de punta a punta pita; entre hilos OL</text><rect x="740" y="768" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="775" y="793" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="828" y="784" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Plancha, tostadora, secador</text><text class="f" x="828" y="808" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">R = 230² / W → 1000 W ≈ 52,9 Ω</text><rect x="740" y="846" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="871" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="862" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Fusible térmico de un aparato</text><text class="f" x="828" y="886" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">pita = bien · OL = fundido</text><rect x="740" y="924" width="70" height="36" rx="18" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="775" y="949" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Ω</text><text class="f" x="828" y="940" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Bombilla halógena o de filamento</text><text class="f" x="828" y="964" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">en frío ~1/10–1/14 del valor encendida</text><rect x="740" y="1002" width="70" height="36" rx="18" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="775" y="1027" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">·)))</text><text class="f" x="828" y="1018" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Cable mordido (caso Valentina)</text><text class="f" x="828" y="1042" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">menea el tramo: si el pitido corta, está ahí</text><text class="f" x="40" y="1120" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Vida real: fusibles del coche o la moto (continuidad), bombilla de faro H4 en frío (Ω con REL: décimas de ohmio), cable del cargador del móvil (continuidad hilo a hilo),</text><text class="f" x="40" y="1146" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">resistencia del electroventilador del coche (Ω en cada escalón), sensor de temperatura del motor (Ω: varios kΩ en frío, cientos de Ω en caliente).</text><text class="f" x="40" y="1186" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">Regla de bolsillo: si la respuesta es «sí o no», continuidad. Si la respuesta es «cuánto», resistencia. Si es «¿aguanta 230 V?», megóhmetro.</text></svg>