<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="940" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">La escala de los ohmios: dónde cae cada cosa que mides</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Escala logarítmica: cada salto es ×10 · el pitido solo «ve» la franja de la izquierda · todo lo demás hay que leerlo en la pantalla</text><line x1="150" y1="500" x2="1330" y2="500" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/><line x1="150.0" y1="492" x2="150.0" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="150.0" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">0,01 Ω</text><line x1="257.27272727272725" y1="492" x2="257.27272727272725" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="257.27272727272725" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">0,1 Ω</text><line x1="364.54545454545456" y1="492" x2="364.54545454545456" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="364.54545454545456" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">1 Ω</text><line x1="471.8181818181818" y1="492" x2="471.8181818181818" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="471.8181818181818" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">10 Ω</text><line x1="579.0909090909091" y1="492" x2="579.0909090909091" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="579.0909090909091" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100 Ω</text><line x1="686.3636363636364" y1="492" x2="686.3636363636364" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="686.3636363636364" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">1 kΩ</text><line x1="793.6363636363636" y1="492" x2="793.6363636363636" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="793.6363636363636" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">10 kΩ</text><line x1="900.9090909090909" y1="492" x2="900.9090909090909" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="900.9090909090909" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100 kΩ</text><line x1="1008.1818181818182" y1="492" x2="1008.1818181818182" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="1008.1818181818182" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">1 MΩ</text><line x1="1115.4545454545455" y1="492" x2="1115.4545454545455" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="1115.4545454545455" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">10 MΩ</text><line x1="1222.7272727272727" y1="492" x2="1222.7272727272727" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="1222.7272727272727" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">100 MΩ</text><line x1="1330.0" y1="492" x2="1330.0" y2="508" stroke="#1f2933" stroke-width="2" stroke-linecap="round"/><text class="f" x="1330.0" y="532" font-size="15" font-weight="600" fill="#1f2933" text-anchor="middle">1 GΩ</text><text class="f" x="40" y="136" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">¿Pita?</text><text class="f" x="40" y="174" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">UT210E</text><rect x="150" y="152" width="321.8181818181818" height="34" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="160" y="175" font-size="14" font-weight="700" fill="#2f855a" text-anchor="start">pita seguro ≤ 10 Ω</text><rect x="471.8181818181818" y="152" width="126.16251688051858" height="34" rx="6" fill="#fff4e0" stroke="#c26a00" stroke-width="2" stroke-dasharray="6 5"/><text class="f" x="534.8994402584411" y="175" font-size="13" font-weight="700" fill="#c26a00" text-anchor="middle">zona gris</text><text class="f" x="609.9806986987004" y="175" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">10–150 Ω: depende de la unidad (pruebas publicadas: ~50 Ω) · más de 150 Ω no pita nunca</text><text class="f" x="40" y="220" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Tacklife</text><rect x="150" y="198" width="386.4027990697268" height="34" rx="6" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="160" y="221" font-size="14" font-weight="700" fill="#2f855a" text-anchor="start">pita + LED verde ≤ 40 Ω</text><rect x="536.4027990697268" y="198" width="18.889789607791272" height="34" rx="6" fill="#fff4e0" stroke="#c26a00" stroke-width="2"/><text class="f" x="567.2925886775181" y="221" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">40–60 Ω: LED rojo, sin pitido · más de 60 Ω: nada</text><line x1="243.2448572075047" y1="316" x2="243.2448572075047" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="243.2448572075047" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="243.2448572075047" y="290" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">10 m de 2,5 mm²</text><text class="f" x="243.2448572075047" y="308" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">0,074 Ω</text><line x1="289.5650358984998" y1="456" x2="289.5650358984998" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="289.5650358984998" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="289.5650358984998" y="430" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">puntas</text><text class="f" x="289.5650358984998" y="448" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">0,1–0,3 Ω</text><line x1="334.0803586808239" y1="386" x2="334.0803586808239" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="334.0803586808239" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="334.0803586808239" y="360" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">lazo 35 m 2,5 mm²</text><text class="f" x="334.0803586808239" y="378" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">0,52 Ω</text><line x1="444.8056247152106" y1="316" x2="444.8056247152106" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="444.8056247152106" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="444.8056247152106" y="290" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">par Cat6 30 m</text><text class="f" x="444.8056247152106" y="308" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">con puente 5,6 Ω</text><line x1="517.220921022312" y1="386" x2="517.220921022312" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="517.220921022312" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="517.220921022312" y="360" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">termo 2000 W</text><text class="f" x="517.220921022312" y="378" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">26,5 Ω</text><line x1="562.4741533833476" y1="456" x2="562.4741533833476" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="562.4741533833476" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="552.4741533833476" y="430" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">bombilla 60 W fría</text><text class="f" x="552.4741533833476" y="448" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">~70 Ω</text><line x1="793.6363636363636" y1="316" x2="793.6363636363636" y2="498" stroke="#5f6b7a" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><circle cx="793.6363636363636" cy="500" r="7" fill="#2563eb" stroke="none" stroke-width="2"/><text class="f" x="793.6363636363636" y="290" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">sonda NTC</text><text class="f" x="793.6363636363636" y="308" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">10 kΩ a 25 °C</text><line x1="975.8895095560457" y1="316" x2="975.8895095560457" y2="512" stroke="#d1342f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 6"/><text class="f" x="975.8895095560457" y="290" font-size="14" font-weight="700" fill="#d1342f" text-anchor="middle">0,5 MΩ: mínimo de</text><text class="f" x="975.8895095560457" y="308" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">aislamiento (REBT)</text><line x1="1147.746854080318" y1="486" x2="1147.746854080318" y2="514" stroke="#c26a00" stroke-width="3" stroke-linecap="round"/><line x1="1198.9289523138818" y1="486" x2="1198.9289523138818" y2="514" stroke="#c26a00" stroke-width="3" stroke-linecap="round"/><text class="f" x="1173.8182083939387" y="448" font-size="13" font-weight="700" fill="#c26a00" text-anchor="middle">topes 20 / 60 MΩ → OL</text><rect x="654.0713277378638" y="560" width="171.85734452427232" height="22" rx="11" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="740.0" y="604" font-size="14" font-weight="700" fill="#d1342f" text-anchor="middle">fuga por humedad</text><text class="f" x="740.0" y="622" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">500 Ω – 20 kΩ: no pita</text><rect x="1222.7272727272727" y="560" width="107.27272727272725" height="22" rx="11" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="1276.3636363636365" y="604" font-size="14" font-weight="700" fill="#2f855a" text-anchor="middle">aislamiento sano</text><text class="f" x="1276.3636363636365" y="622" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">&gt; 100 MΩ (megóhmetro)</text><rect x="900.9090909090909" y="650" width="182.2531459196822" height="22" rx="11" fill="#f1ecfb" stroke="#6b46c1" stroke-width="2"/><text class="f" x="992.035663868932" y="694" font-size="14" font-weight="700" fill="#6b46c1" text-anchor="middle">tus dos manos en las puntas</text><text class="f" x="992.035663868932" y="712" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">100 kΩ – 5 MΩ (secas)</text><rect x="150" y="770" width="246.8377631712271" height="70" rx="8" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="162" y="798" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">CONDUCTOR</text><text class="f" x="162" y="820" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">0–2 Ω: bien</text><rect x="396.8377631712271" y="770" width="74.98041864695472" height="70" rx="8" fill="#fff4e0" stroke="#c26a00" stroke-width="2"/><text class="f" x="406.8377631712271" y="798" font-size="15" font-weight="700" fill="#c26a00" text-anchor="start">2–10 Ω</text><text class="f" x="406.8377631712271" y="820" font-size="12" font-weight="400" fill="#1f2933" text-anchor="start">si es largo</text><rect x="471.8181818181818" y="770" width="504.0713277378639" height="70" rx="8" fill="#fdecea" stroke="#d1342f" stroke-width="2"/><text class="f" x="723.8538456871138" y="798" font-size="15" font-weight="700" fill="#d1342f" text-anchor="middle">ZONA DE AVERÍA</text><text class="f" x="723.8538456871138" y="820" font-size="13" font-weight="400" fill="#1f2933" text-anchor="middle">en un cable: empalme flojo o degradado · en un aislamiento: fuga</text><rect x="975.8895095560457" y="770" width="354.1104904439543" height="70" rx="8" fill="#e6f4ec" stroke="#2f855a" stroke-width="2"/><text class="f" x="987.8895095560457" y="798" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">AISLAMIENTO</text><text class="f" x="987.8895095560457" y="820" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">cuanto más alto, mejor</text><text class="f" x="40" y="890" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Regla: en un conductor quieres el número más bajo posible; en un aislamiento, el más alto posible. Son dos medidas distintas con el mismo modo Ω.</text><text class="f" x="40" y="916" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">Cobre a 20 °C (2,5 mm² ≈ 7,41 Ω/km; Cat6 máx. 9,38 Ω/100 m por hilo). Umbrales: manual de cada aparato y pruebas publicadas del UT210E. Fuga por humedad: rango de tu ficha de la UT210E.</text></svg>