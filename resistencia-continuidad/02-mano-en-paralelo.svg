<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="820" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">¿Cambia la medida si tocas las puntas con los dedos?</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Tu cuerpo es una resistencia más, conectada EN PARALELO con lo que mides. Importa según cuánto valga lo que mides.</text><rect x="60" y="140" width="190" height="120" rx="12" fill="#f3f5f7" stroke="#1f2933" stroke-width="2"/><text class="f" x="155" y="190" font-size="40" font-weight="700" fill="#1f2933" text-anchor="middle">Ω</text><text class="f" x="155" y="230" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">1 V, 0,3 mA</text><path d="M250,175 L340,175 L340,130" stroke="#d1342f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,225 L280,225 L280,430 L740,430 L740,130" stroke="#1f2933" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M340,130 L340,130" stroke="#1f2933" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="340" y1="130" x2="410" y2="130" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/><path d="M410,130 L462.0,130 L475.0,118 L501.0,142 L527.0,118 L553.0,142 L579.0,118 L605.0,142 L618.0,130 L670,130" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="670" y1="130" x2="740" y2="130" stroke="#1f2933" stroke-width="3" stroke-linecap="round"/><text class="f" x="540" y="108" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">lo que quieres medir</text><line x1="340" y1="130" x2="340" y2="300" stroke="#6b46c1" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/><line x1="740" y1="300" x2="670" y2="300" stroke="#6b46c1" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/><path d="M410,300 L462.0,300 L475.0,288 L501.0,312 L527.0,288 L553.0,312 L579.0,288 L605.0,312 L618.0,300 L670,300" stroke="#6b46c1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line x1="340" y1="300" x2="410" y2="300" stroke="#6b46c1" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/><text class="f" x="540" y="340" font-size="15" font-weight="700" fill="#6b46c1" text-anchor="middle">tus dedos: mano → brazos → mano</text><text class="f" x="540" y="360" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">100 kΩ a varios MΩ (secos) · ~10 kΩ apretando fuerte</text><circle cx="340" cy="130" r="6" fill="#1f2933" stroke="none" stroke-width="2"/><circle cx="740" cy="130" r="6" fill="#1f2933" stroke="none" stroke-width="2"/><text class="f" x="340" y="108" font-size="13" font-weight="400" fill="#d1342f" text-anchor="middle">punta roja</text><text class="f" x="290" y="420" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">punta negra</text><rect x="60" y="470" width="650" height="300" rx="12" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="84" y="508" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Lo que lee el multímetro</text><text class="f" x="84" y="552" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">R leída = (R × Rcuerpo) / (R + Rcuerpo)</text><text class="f" x="84" y="594" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• Si R es mil veces menor que tu cuerpo → no se nota.</text><text class="f" x="84" y="620" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• Si R es 10 veces menor → error de ~10 %.</text><text class="f" x="84" y="646" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• Si R es igual a tu cuerpo → lees la MITAD.</text><text class="f" x="84" y="672" font-size="15" font-weight="700" fill="#d1342f" text-anchor="start">• Si no hay nada (OL) → lees TU CUERPO.</text><text class="f" x="84" y="710" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Continuidad: tu cuerpo nunca la hace pitar. El umbral es de</text><text class="f" x="84" y="732" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">10–50 Ω y con los dedos en las puntas estás en miles de Ω o más.</text><text class="f" x="84" y="754" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">Una sola mano en una punta: no pasa nada (no cierra camino).</text><text class="f" x="760" y="126" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Ejemplo: tus dedos = 100 kΩ (secos, apretando normal)</text><rect x="760" y="140" width="600" height="48" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="171" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Lo que mides</text><text class="f" x="982" y="171" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Real</text><text class="f" x="1102" y="171" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Con dedos</text><text class="f" x="1242" y="171" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Error</text><rect x="760" y="188" width="600" height="48" rx="0" fill="#e6f4ec" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="219" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Cable 2,5 mm²</text><text class="f" x="982" y="219" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,5 Ω</text><text class="f" x="1102" y="219" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,5 Ω</text><text class="f" x="1242" y="219" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">0 %</text><rect x="760" y="236" width="600" height="48" rx="0" fill="#e6f4ec" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="267" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Termo 2000 W</text><text class="f" x="982" y="267" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">26,5 Ω</text><text class="f" x="1102" y="267" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">26,49 Ω</text><text class="f" x="1242" y="267" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">0,03 %</text><rect x="760" y="284" width="600" height="48" rx="0" fill="#e6f4ec" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="315" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Bombilla fría</text><text class="f" x="982" y="315" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">70 Ω</text><text class="f" x="1102" y="315" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">69,95 Ω</text><text class="f" x="1242" y="315" font-size="15" font-weight="700" fill="#2f855a" text-anchor="start">0,07 %</text><rect x="760" y="332" width="600" height="48" rx="0" fill="#fff4e0" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="363" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Sonda NTC</text><text class="f" x="982" y="363" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">10 kΩ</text><text class="f" x="1102" y="363" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">9,09 kΩ</text><text class="f" x="1242" y="363" font-size="15" font-weight="700" fill="#c26a00" text-anchor="start">−9 %</text><rect x="760" y="380" width="600" height="48" rx="0" fill="#fdecea" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="411" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Resist. 100 kΩ</text><text class="f" x="982" y="411" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">100 kΩ</text><text class="f" x="1102" y="411" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">50 kΩ</text><text class="f" x="1242" y="411" font-size="15" font-weight="700" fill="#d1342f" text-anchor="start">−50 %</text><rect x="760" y="428" width="600" height="48" rx="0" fill="#fdecea" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="772" y="459" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Aislamiento OL</text><text class="f" x="982" y="459" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">OL</text><text class="f" x="1102" y="459" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">100 kΩ</text><text class="f" x="1242" y="459" font-size="15" font-weight="700" fill="#d1342f" text-anchor="start">¡falsa fuga!</text><text class="f" x="760" y="510" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Verde: tócalo, da igual · Ámbar: no toques · Rojo: el resultado es falso</text><rect x="760" y="536" width="600" height="150" rx="12" fill="#fff4e0" stroke="#c26a00" stroke-width="2"/><text class="f" x="780" y="570" font-size="16" font-weight="700" fill="#c26a00" text-anchor="start">El caso que te puede engañar en obra</text><text class="f" x="780" y="598" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">Mides fase contra tierra de un cable suelto sujetando</text><text class="f" x="780" y="620" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">con cada mano un cobre y la punta: lees 300 kΩ – 2 MΩ</text><text class="f" x="780" y="642" font-size="14" font-weight="700" fill="#1f2933" text-anchor="start">y crees que hay fuga. Era tu cuerpo. Usa pinzas cocodrilo.</text><text class="f" x="780" y="664" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">(Y nunca lo hagas en un cable que pueda tener tensión.)</text></svg>