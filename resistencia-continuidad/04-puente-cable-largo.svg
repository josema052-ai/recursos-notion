<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="880" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Cable largo sin ayudante: el truco del puente</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Unes los dos hilos en el extremo lejano y mides desde el cercano: lees la ida + la vuelta (el «lazo»)</text><rect x="60" y="150" width="170" height="120" rx="12" fill="#f3f5f7" stroke="#1f2933" stroke-width="2"/><text class="f" x="145" y="205" font-size="34" font-weight="700" fill="#1f2933" text-anchor="middle">Ω</text><text class="f" x="145" y="240" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">aquí mides</text><line x1="230" y1="180" x2="1150" y2="180" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><line x1="230" y1="240" x2="1150" y2="240" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text class="f" x="690" y="164" font-size="14" font-weight="700" fill="#8b5a2b" text-anchor="middle">hilo 1 (ej. marrón)</text><text class="f" x="690" y="272" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">hilo 2 (ej. azul)</text><rect x="1150" y="160" width="90" height="100" rx="8" fill="#fff" stroke="#1f2933" stroke-width="2"/><line x1="1150" y1="180" x2="1200" y2="180" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><line x1="1150" y1="240" x2="1200" y2="240" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><line x1="1200" y1="180" x2="1200" y2="240" stroke="#1f2933" stroke-width="6" stroke-linecap="round"/><text class="f" x="1250" y="136" font-size="14" font-weight="700" fill="#1f2933" text-anchor="end">puente (Wago) en el extremo lejano</text><line x1="1195" y1="142" x2="1195" y2="158" stroke="#1f2933" stroke-width="1.5" stroke-linecap="round"/><text class="f" x="690" y="352" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Distancia L (largo del cable, no del lazo)</text><path d="M240,325 L1140,325" stroke="#5f6b7a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M250,318 L240,325 L250,332" stroke="#5f6b7a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M1130,318 L1140,325 L1130,332" stroke="#5f6b7a" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text class="f" x="60" y="385" font-size="18" font-weight="700" fill="#1f2933" text-anchor="start">R del lazo = 2 × L × (Ω por metro)   +   0,1–0,3 Ω de las puntas (réstalas con REL o juntándolas antes)</text><rect x="60" y="420" width="230" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="72" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Cable</text><rect x="290" y="420" width="230" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="302" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Ω por metro (1 hilo)</text><rect x="520" y="420" width="170" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="532" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">L = 10 m</text><rect x="690" y="420" width="170" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="702" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">L = 25 m</text><rect x="860" y="420" width="170" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="872" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">L = 50 m</text><rect x="1030" y="420" width="170" height="46" rx="0" fill="#f3f5f7" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="1042" y="450" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">L = 90 m</text><rect x="60" y="466" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="72" y="496" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">1,5 mm² (luces)</text><rect x="290" y="466" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="302" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,0121</text><rect x="520" y="466" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="532" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,24 Ω</text><rect x="690" y="466" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="702" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,61 Ω</text><rect x="860" y="466" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="872" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">1,21 Ω</text><rect x="1030" y="466" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="1042" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">2,18 Ω</text><rect x="60" y="512" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="72" y="542" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">2,5 mm² (enchufes)</text><rect x="290" y="512" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="302" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,00741</text><rect x="520" y="512" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="532" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,15 Ω</text><rect x="690" y="512" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="702" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,37 Ω</text><rect x="860" y="512" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="872" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,74 Ω</text><rect x="1030" y="512" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="1042" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">1,33 Ω</text><rect x="60" y="558" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="72" y="588" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">6 mm² (horno, jacuzzi)</text><rect x="290" y="558" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="302" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,00308</text><rect x="520" y="558" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="532" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,06 Ω</text><rect x="690" y="558" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="702" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,15 Ω</text><rect x="860" y="558" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="872" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,31 Ω</text><rect x="1030" y="558" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="1042" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,55 Ω</text><rect x="60" y="604" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="72" y="634" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Cat6, un par (máx. norma)</text><rect x="290" y="604" width="230" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="302" y="634" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0,0938</text><rect x="520" y="604" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="532" y="634" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">1,9 Ω</text><rect x="690" y="604" width="170" height="46" rx="0" fill="#ffffff" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="702" y="634" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">4,7 Ω</text><rect x="860" y="604" width="170" height="46" rx="0" fill="#fff4e0" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="872" y="634" font-size="15" font-weight="400" fill="#c26a00" text-anchor="start">9,4 Ω</text><rect x="1030" y="604" width="170" height="46" rx="0" fill="#fff4e0" stroke="#cbd2d9" stroke-width="1"/><text class="f" x="1042" y="634" font-size="15" font-weight="400" fill="#c26a00" text-anchor="start">16,9 Ω</text><text class="f" x="60" y="686" font-size="16" font-weight="700" fill="#1f2933" text-anchor="start">Cómo leerlo:</text><text class="f" x="60" y="714" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• En cables de cobre de vivienda casi todo cae por debajo de 1–2 Ω: si mides 5, 10 o 50 Ω de más, hay un empalme o borne malo en el camino.</text><text class="f" x="60" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• En Cat6 el lazo de 50 m ya roza los 10 Ω que tu UT210E garantiza para pitar. No te fíes del silencio en cables de red largos: mira la cifra.</text><text class="f" x="60" y="766" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• Comparar hilos entre sí vale más que el número absoluto: si 7 hilos dan ~3 Ω y uno da 10 Ω, ese conector está mal crimpado.</text><text class="f" x="60" y="792" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">• Cable de 10 m de 2,5 mm²: 0,15 Ω de lazo, menos que tus puntas. Para ver cortes sirve; para ver un borne algo flojo, no: mide caída de tensión con carga.</text></svg>