<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><defs><marker id="m5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="m5f6b7as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs><rect x="0" y="0" width="1400" height="760" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">De la red de i-DE al cuadro de la casa: qué es cada parte</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Parcela en Yuncos (Toledo) · distribuidora: i-DE (Iberdrola) · suministro monofásico con CPM1</text><rect x="40" y="190" width="195" height="160" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="137.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Red de i-DE</text><text class="f" x="137.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">cable de la compañía</text><text class="f" x="137.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">bajo la acera</text><text class="f" x="137.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">siempre con tensión</text><text class="f" x="137.5" y="307" font-size="14" font-weight="400" fill="#1d4ed8" text-anchor="middle">solo la toca i-DE</text><rect x="265" y="190" width="195" height="160" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="362.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Acometida</text><text class="f" x="362.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">cable de la red</text><text class="f" x="362.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">hasta la CPM1</text><text class="f" x="362.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">entra por tubos</text><text class="f" x="362.5" y="307" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">de 110 mm</text><text class="f" x="362.5" y="328" font-size="14" font-weight="400" fill="#1d4ed8" text-anchor="middle">la hace i-DE</text><rect x="490" y="190" width="195" height="160" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="587.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">CPM1</text><text class="f" x="587.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">caja de protección</text><text class="f" x="587.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">y medida: fusible</text><text class="f" x="587.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">+ contador (de i-DE)</text><text class="f" x="587.5" y="307" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">en la valla</text><text class="f" x="587.5" y="328" font-size="14" font-weight="400" fill="#553c9a" text-anchor="middle">firma tu colega</text><rect x="715" y="190" width="195" height="160" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="812.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Derivación individual</text><text class="f" x="812.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">cable CPM1 → cuadro</text><text class="f" x="812.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">fase + neutro + tierra</text><text class="f" x="812.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">mín. 6 mm² · caída ≤ 1,5 %</text><text class="f" x="812.5" y="307" font-size="14" font-weight="400" fill="#276749" text-anchor="middle">la montáis vosotros</text><rect x="940" y="190" width="195" height="160" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="1037.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Cuadro de la casa</text><text class="f" x="1037.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">IGA + diferencial 30 mA</text><text class="f" x="1037.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">+ magnetotérmicos</text><text class="f" x="1037.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">a 1,4-2 m del suelo</text><text class="f" x="1037.5" y="307" font-size="14" font-weight="400" fill="#276749" text-anchor="middle">la montáis vosotros</text><rect x="1165" y="190" width="195" height="160" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="1262.5" y="220" font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">Circuitos</text><text class="f" x="1262.5" y="244" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">luces, enchufes,</text><text class="f" x="1262.5" y="265" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">cocina, baño…</text><text class="f" x="1262.5" y="286" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">mínimo C1 a C5</text><text class="f" x="1262.5" y="307" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">(ITC-BT-25)</text><line x1="237" y1="270.0" x2="261" y2="270.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="462" y1="270.0" x2="486" y2="270.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="687" y1="270.0" x2="711" y2="270.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="912" y1="270.0" x2="936" y2="270.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="1137" y1="270.0" x2="1161" y2="270.0" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="477" y1="135" x2="477" y2="385" stroke="#c53030" stroke-width="2" stroke-dasharray="7 6"/><text class="f" x="477" y="128" font-size="14" font-weight="700" fill="#c53030" text-anchor="middle">Límite de la parcela (valla)</text><text class="f" x="467" y="160" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">← calle: de i-DE</text><text class="f" x="487" y="160" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="start">parcela: del cliente →</text><rect x="40" y="425" width="315" height="160" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="58" y="455" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start">i-DE (la compañía)</text><text class="f" x="58" y="481" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Pone el cable de la acometida,</text><text class="f" x="58" y="504" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">el contador y los precintos.</text><text class="f" x="58" y="527" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Conecta al final, cuando el</text><text class="f" x="58" y="550" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">certificado ya está presentado.</text><rect x="375" y="425" width="315" height="160" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="393" y="455" font-size="17" font-weight="700" fill="#553c9a" text-anchor="start">Tu colega (instalador autorizado)</text><text class="f" x="393" y="481" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Pide el suministro, dirige la obra,</text><text class="f" x="393" y="504" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">hace las mediciones y presenta</text><text class="f" x="393" y="527" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">el certificado (CIE) en eDice.</text><text class="f" x="393" y="550" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Responde de todo lo que firma.</text><rect x="710" y="425" width="315" height="160" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="728" y="455" font-size="17" font-weight="700" fill="#276749" text-anchor="start">Tú (ayudante)</text><text class="f" x="728" y="481" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Nicho, tubos, CPM1, cable y</text><text class="f" x="728" y="504" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">cuadro, con tu colega delante</text><text class="f" x="728" y="527" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">o revisándolo todo antes</text><text class="f" x="728" y="550" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">de cerrar. Siempre sin tensión.</text><rect x="1045" y="425" width="315" height="160" rx="10" fill="#fff8e1" stroke="#d69e2e" stroke-width="2"/><text class="f" x="1063" y="455" font-size="17" font-weight="700" fill="#975a16" text-anchor="start">El cliente</text><text class="f" x="1063" y="481" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Paga los derechos a i-DE.</text><text class="f" x="1063" y="504" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">La zanja y el nicho los puede</text><text class="f" x="1063" y="527" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">hacer su albañil si se acuerda.</text><text class="f" x="1063" y="550" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Al final contrata la luz.</text><rect x="40" y="610" width="1320" height="110" rx="10" fill="#fdecec" stroke="#c53030" stroke-width="2"/><text class="f" x="58" y="640" font-size="17" font-weight="700" fill="#c53030" text-anchor="start">Lo que no se toca nunca</text><text class="f" x="58" y="666" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">La red, la acometida y la entrada de la CPM1 cuando ya tienen tensión: son de i-DE y no se pueden cortar desde la parcela.</text><text class="f" x="58" y="689" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Los precintos de i-DE no se rompen. Si hay que abrir algo precintado, lo abre i-DE.</text></svg>