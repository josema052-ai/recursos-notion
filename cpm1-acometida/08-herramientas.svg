<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="820" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Herramientas para el trabajo de la CPM1</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Verde: ya la tienes · azul: la pone tu colega · naranja: compra o pide prestado lo que no tengas</text><rect x="40" y="120" width="315" height="520" rx="10" fill="#f8f9fa" stroke="#c9d1db" stroke-width="2"/><text class="f" x="60" y="156" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Medir</text><rect x="56" y="180" width="283" height="58" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="70" y="215" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Multímetro (el tuyo)</text><rect x="56" y="252" width="283" height="58" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="70" y="287" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Megóhmetro (tu Megger)</text><rect x="56" y="324" width="283" height="58" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="70" y="359" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Pinza UNI-T UT210E</text><rect x="56" y="396" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="70" y="431" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Comprobador bipolar</text><rect x="56" y="468" width="283" height="58" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="70" y="503" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Telurómetro</text><rect x="56" y="540" width="283" height="58" rx="8" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="70" y="575" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Comprobador de diferenciales</text><rect x="375" y="120" width="315" height="520" rx="10" fill="#f8f9fa" stroke="#c9d1db" stroke-width="2"/><text class="f" x="395" y="156" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Obra civil</text><rect x="391" y="180" width="283" height="58" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="405" y="215" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Radial Bosch GWS 750 + diamante</text><rect x="391" y="252" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="405" y="287" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Martillo SDS-plus con cincel</text><rect x="391" y="324" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="405" y="359" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Pala y pico (zanja de 60 cm)</text><rect x="391" y="396" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="405" y="431" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Nivel y flexómetro</text><rect x="391" y="468" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="405" y="503" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Paleta, cubo y mortero</text><rect x="391" y="540" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="405" y="575" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Mazo para clavar la pica</text><rect x="710" y="120" width="315" height="520" rx="10" fill="#f8f9fa" stroke="#c9d1db" stroke-width="2"/><text class="f" x="730" y="156" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Cable y montaje</text><rect x="726" y="180" width="283" height="58" rx="8" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="740" y="215" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Taladro Bosch GSB 18V-65</text><rect x="726" y="252" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="740" y="287" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Cuchillo de gancho (manguera)</text><rect x="726" y="324" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="740" y="359" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Guía pasacables de 15-20 m</text><rect x="726" y="396" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="740" y="431" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Crimpadora hexagonal 10-25 mm²</text><rect x="726" y="468" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="740" y="503" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Terminales de pala M8</text><rect x="726" y="540" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="740" y="575" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Llaves de vaso M8 y M10</text><rect x="1045" y="120" width="315" height="520" rx="10" fill="#f8f9fa" stroke="#c9d1db" stroke-width="2"/><text class="f" x="1065" y="156" font-size="20" font-weight="700" fill="#1f2933" text-anchor="start">Seguridad</text><rect x="1061" y="180" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="215" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Guantes aislantes clase 0</text><rect x="1061" y="252" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="287" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Gafas de protección</text><rect x="1061" y="324" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="359" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Destornilladores y alicates VDE</text><rect x="1061" y="396" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="431" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Candado y etiqueta de corte</text><rect x="1061" y="468" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="503" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Calzado de seguridad</text><rect x="1061" y="540" width="283" height="58" rx="8" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="1075" y="575" font-size="15" font-weight="700" fill="#1f2933" text-anchor="start">Guantes de obra</text><rect x="40" y="660" width="1320" height="130" rx="10" fill="#fff8e1" stroke="#d69e2e" stroke-width="2"/><text class="f" x="58" y="690" font-size="17" font-weight="700" fill="#975a16" text-anchor="start">Ojo con estas tres</text><text class="f" x="58" y="716" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Crimpadora: los terminales de 10-16 mm² no se aprietan con alicates. Mal crimpado = calentamiento en la CPM1.</text><text class="f" x="58" y="739" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Martillo SDS-plus: tu Bosch GSB 18V-65 hace taladros, pero para picar un nicho en bloque o ladrillo hace falta SDS.</text><text class="f" x="58" y="762" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Telurómetro y comprobador de diferenciales: son los equipos que exige la ITC-BT-03 a la empresa instaladora.</text></svg>