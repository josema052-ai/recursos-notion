<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="720" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Qué sección de cable lleva la derivación individual</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Casa de 9,2 kW (IGA de 40 A) · monofásica 230 V · caída de tensión máxima 1,5 % (ITC-BT-15) · cobre</text><rect x="40" y="120" width="520" height="300" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="58" y="150" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="start">La cuenta (te la revisa tu colega)</text><text class="f" x="58" y="176" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">S = 2 × L × I ÷ (γ × ΔU)</text><text class="f" x="58" y="199" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">S = sección en mm²</text><text class="f" x="58" y="222" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">L = metros de la CPM1 al cuadro</text><text class="f" x="58" y="245" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">I = 40 A (IGA de la casa)</text><text class="f" x="58" y="268" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">γ = 48 (cobre caliente, a 70 °C)</text><text class="f" x="58" y="291" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">ΔU = 1,5 % de 230 V = 3,45 V</text><text class="f" x="58" y="314" font-size="16" font-weight="400" fill="#1d4ed8" text-anchor="start">Ej. 20 m: 2×20×40 ÷ (48×3,45) = 9,7 mm²</text><text class="f" x="58" y="337" font-size="16" font-weight="400" fill="#1d4ed8" text-anchor="start">→ la sección comercial siguiente: 10 mm²</text><text class="f" x="58" y="360" font-size="16" font-weight="400" fill="#1f2933" text-anchor="start">Con γ = 44 (cable a 90 °C) a veces sale una más.</text><rect x="40" y="440" width="520" height="200" rx="10" fill="#fff8e1" stroke="#d69e2e" stroke-width="2"/><text class="f" x="58" y="470" font-size="17" font-weight="700" fill="#975a16" text-anchor="start">Además, por calentamiento</text><text class="f" x="58" y="496" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">i-DE calcula la derivación para 1,5 veces la</text><text class="f" x="58" y="519" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">potencia del IGA: 1,5 × 9,2 = 13,8 kW.</text><text class="f" x="58" y="542" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Enterrado y de 0,6/1 kV, el de 10 mm² de cobre</text><text class="f" x="58" y="565" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">aguanta 18 kW (tabla 3 del MT 2.80.12): vale.</text><text class="f" x="58" y="588" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si te sale 6 mm² (el mínimo), que lo mire tu colega.</text><text class="f" x="660" y="140" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">Sección calculada (barra) y la que se pone (número)</text><line x1="660" y1="640" x2="1340" y2="640" stroke="#1f2933" stroke-width="2"/><line x1="660" y1="640" x2="660" y2="180" stroke="#1f2933" stroke-width="2"/><line x1="660" y1="640.0" x2="1340" y2="640.0" stroke="#e2e8f0" stroke-width="1"/><text class="f" x="650" y="645.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">0</text><line x1="660" y1="548.0" x2="1340" y2="548.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/><text class="f" x="650" y="553.0" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">6</text><line x1="660" y1="486.6666666666667" x2="1340" y2="486.6666666666667" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/><text class="f" x="650" y="491.6666666666667" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">10</text><line x1="660" y1="394.66666666666663" x2="1340" y2="394.66666666666663" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/><text class="f" x="650" y="399.66666666666663" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">16</text><line x1="660" y1="256.66666666666663" x2="1340" y2="256.66666666666663" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/><text class="f" x="650" y="261.66666666666663" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="end">25</text><text class="f" x="620" y="410.0" font-size="14" fill="#5f6b7a" text-anchor="middle" transform="rotate(-90 620 410.0)">mm²</text><rect x="690.75" y="565.925925925926" width="62" height="74.07407407407406" rx="4" fill="#2f855a" fill-opacity="0.25" stroke="#2f855a" stroke-width="0"/><text class="f" x="721.75" y="533.925925925926" font-size="17" font-weight="700" fill="#2f855a" text-anchor="middle">6 mm²</text><text class="f" x="721.75" y="553.925925925926" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(4,8)</text><text class="f" x="721.75" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">10 m</text><rect x="783.5" y="528.8888888888889" width="62" height="111.1111111111111" rx="4" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="0"/><text class="f" x="814.5" y="496.8888888888889" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">10 mm²</text><text class="f" x="814.5" y="516.8888888888889" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(7,2)</text><text class="f" x="814.5" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">15 m</text><rect x="876.25" y="491.85185185185185" width="62" height="148.14814814814812" rx="4" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="0"/><text class="f" x="907.25" y="459.85185185185185" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">10 mm²</text><text class="f" x="907.25" y="479.85185185185185" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(9,7)</text><text class="f" x="907.25" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">20 m</text><rect x="969.0" y="454.81481481481484" width="62" height="185.18518518518516" rx="4" fill="#6b46c1" fill-opacity="0.25" stroke="#6b46c1" stroke-width="0"/><text class="f" x="1000.0" y="422.81481481481484" font-size="17" font-weight="700" fill="#6b46c1" text-anchor="middle">16 mm²</text><text class="f" x="1000.0" y="442.81481481481484" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(12,1)</text><text class="f" x="1000.0" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">25 m</text><rect x="1061.75" y="417.7777777777778" width="62" height="222.2222222222222" rx="4" fill="#6b46c1" fill-opacity="0.25" stroke="#6b46c1" stroke-width="0"/><text class="f" x="1092.75" y="385.7777777777778" font-size="17" font-weight="700" fill="#6b46c1" text-anchor="middle">16 mm²</text><text class="f" x="1092.75" y="405.7777777777778" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(14,5)</text><text class="f" x="1092.75" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">30 m</text><rect x="1154.5" y="343.70370370370375" width="62" height="296.29629629629625" rx="4" fill="#c05621" fill-opacity="0.25" stroke="#c05621" stroke-width="0"/><text class="f" x="1185.5" y="311.70370370370375" font-size="17" font-weight="700" fill="#c05621" text-anchor="middle">25 mm²</text><text class="f" x="1185.5" y="331.70370370370375" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(19,3)</text><text class="f" x="1185.5" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">40 m</text><rect x="1247.25" y="269.6296296296297" width="62" height="370.3703703703703" rx="4" fill="#c05621" fill-opacity="0.25" stroke="#c05621" stroke-width="0"/><text class="f" x="1278.25" y="237.62962962962968" font-size="17" font-weight="700" fill="#c05621" text-anchor="middle">25 mm²</text><text class="f" x="1278.25" y="257.6296296296297" font-size="13" font-weight="400" fill="#5f6b7a" text-anchor="middle">(24,2)</text><text class="f" x="1278.25" y="662" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">50 m</text><text class="f" x="1000.0" y="690" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="middle">metros de cable de la CPM1 al cuadro de la casa</text></svg>