<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><defs><marker id="m5f6b7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker><marker id="m5f6b7as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker></defs><rect x="0" y="0" width="1400" height="860" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">El trabajo de principio a fin: 8 pasos y quién hace cada uno</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Nuevo suministro con i-DE en Castilla-La Mancha · el orden importa: i-DE conecta lo último</text><rect x="40" y="100" width="104.19999999999999" height="26" rx="13" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><text class="f" x="92.1" y="118" font-size="13" font-weight="700" fill="#276749" text-anchor="middle">Tú + colega</text><rect x="156.2" y="100" width="153.39999999999998" height="26" rx="13" fill="#f3ecfd" stroke="#6b46c1" stroke-width="1.5"/><text class="f" x="232.89999999999998" y="118" font-size="13" font-weight="700" fill="#553c9a" text-anchor="middle">Tu colega (firma)</text><rect x="321.59999999999997" y="100" width="46.8" height="26" rx="13" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.5"/><text class="f" x="344.99999999999994" y="118" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">i-DE</text><rect x="380.4" y="100" width="71.39999999999999" height="26" rx="13" fill="#fff8e1" stroke="#d69e2e" stroke-width="1.5"/><text class="f" x="416.09999999999997" y="118" font-size="13" font-weight="700" fill="#975a16" text-anchor="middle">Cliente</text><rect x="40" y="160" width="300" height="190" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="58" y="190" font-size="18" font-weight="700" fill="#276749" text-anchor="start">1. Ver y medir</text><text class="f" x="58" y="216" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Fotos de la caja actual y</text><text class="f" x="58" y="239" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">del recorrido. Metros hasta</text><text class="f" x="58" y="262" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">la casa. Potencia y si es</text><text class="f" x="58" y="285" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">monofásica o trifásica.</text><rect x="380" y="160" width="300" height="190" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="398" y="190" font-size="18" font-weight="700" fill="#553c9a" text-anchor="start">2. Pedir el suministro</text><text class="f" x="398" y="216" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Tu colega (o el cliente)</text><text class="f" x="398" y="239" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">lo pide a i-DE por su web,</text><text class="f" x="398" y="262" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">con potencia, dirección</text><text class="f" x="398" y="285" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">y plano de situación.</text><rect x="720" y="160" width="300" height="190" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="738" y="190" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="start">3. Condiciones de i-DE</text><text class="f" x="738" y="216" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">i-DE contesta con lo que</text><text class="f" x="738" y="239" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">hay que hacer y lo que</text><text class="f" x="738" y="262" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">cuesta. El cliente acepta</text><text class="f" x="738" y="285" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">y paga los derechos.</text><rect x="1060" y="160" width="300" height="190" rx="10" fill="#fff8e1" stroke="#d69e2e" stroke-width="2"/><text class="f" x="1078" y="190" font-size="18" font-weight="700" fill="#975a16" text-anchor="start">4. Obra civil</text><text class="f" x="1078" y="216" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Nicho en la valla, 2 tubos</text><text class="f" x="1078" y="239" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">de 110 mm a la calle y la</text><text class="f" x="1078" y="262" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">zanja de 60 cm hasta la</text><text class="f" x="1078" y="285" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">casa (cliente o vosotros).</text><rect x="40" y="470" width="300" height="190" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="58" y="500" font-size="18" font-weight="700" fill="#276749" text-anchor="start">5. Montaje</text><text class="f" x="58" y="526" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">CPM1 con su fusible, cable</text><text class="f" x="58" y="549" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">de la derivación individual,</text><text class="f" x="58" y="572" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">pica de tierra y cuadro.</text><text class="f" x="58" y="595" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Todo sin tensión.</text><rect x="380" y="470" width="300" height="190" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="398" y="500" font-size="18" font-weight="700" fill="#553c9a" text-anchor="start">6. Mediciones</text><text class="f" x="398" y="526" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Aislamiento, tierra</text><text class="f" x="398" y="549" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">(menos de 37 Ω),</text><text class="f" x="398" y="572" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">continuidad y disparo</text><text class="f" x="398" y="595" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">del diferencial.</text><rect x="720" y="470" width="300" height="190" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="738" y="500" font-size="18" font-weight="700" fill="#553c9a" text-anchor="start">7. Certificado (CIE)</text><text class="f" x="738" y="526" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Tu colega lo presenta en</text><text class="f" x="738" y="549" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">eDice (Junta de Castilla-</text><text class="f" x="738" y="572" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">La Mancha) y paga la tasa.</text><text class="f" x="738" y="595" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Sin esto no hay luz.</text><rect x="1060" y="470" width="300" height="190" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="1078" y="500" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="start">8. Conexión y alta</text><text class="f" x="1078" y="526" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">i-DE pone la acometida</text><text class="f" x="1078" y="549" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">y el contador, y precinta.</text><text class="f" x="1078" y="572" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">El cliente contrata la luz</text><text class="f" x="1078" y="595" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">con su comercializadora.</text><line x1="344" y1="255" x2="374" y2="255" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="344" y1="565" x2="374" y2="565" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="684" y1="255" x2="714" y2="255" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="684" y1="565" x2="714" y2="565" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="1024" y1="255" x2="1054" y2="255" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><line x1="1024" y1="565" x2="1054" y2="565" stroke="#5f6b7a" stroke-width="2.5" marker-end="url(#m5f6b7a)"/><path d="M1210.0,354 L1210.0,410 L190.0,410 L190.0,464" stroke="#5f6b7a" stroke-width="2.5" fill="none" marker-end="url(#m5f6b7a)" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="700" width="1320" height="130" rx="10" fill="#fdecec" stroke="#c53030" stroke-width="2"/><text class="f" x="58" y="730" font-size="17" font-weight="700" fill="#c53030" text-anchor="start">Si i-DE ve algo mal, no conecta</text><text class="f" x="58" y="756" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">En un caso real de un foro, i-DE rechazó las fotos de una CPM1 recién puesta porque faltaban el fusible y la derivación</text><text class="f" x="58" y="779" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">individual. Antes de avisar a i-DE: fusible puesto, cable conectado, tubos sellados, puerta con llave triangular y fotos.</text><text class="f" x="58" y="802" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Precios de los derechos (extensión, acceso, enganche): los fija el Gobierno y vienen en las condiciones de i-DE.</text></svg>