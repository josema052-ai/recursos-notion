<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="560" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">Las 5 mediciones antes de pedir la conexión</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Se apuntan con fecha y foto · las firma tu colega en el certificado · equipos de la ITC-BT-03</text><rect x="40" y="130" width="250" height="200" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="58" y="160" font-size="18" font-weight="700" fill="#553c9a" text-anchor="start">1. Aislamiento</text><text class="f" x="58" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Megóhmetro a 500 V</text><text class="f" x="58" y="209" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">en continua, sin tensión</text><text class="f" x="58" y="232" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">y sin aparatos enchufados.</text><text class="f" x="58" y="255" font-size="15" font-weight="400" fill="#276749" text-anchor="start">Bien: 0,5 MΩ o más</text><text class="f" x="58" y="278" font-size="15" font-weight="400" fill="#1d4ed8" text-anchor="start">Tienes: tu Megger</text><rect x="306" y="130" width="250" height="200" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="324" y="160" font-size="18" font-weight="700" fill="#276749" text-anchor="start">2. Continuidad</text><text class="f" x="324" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">De la tierra de cada</text><text class="f" x="324" y="209" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">enchufe a la barra de</text><text class="f" x="324" y="232" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">tierra del cuadro.</text><text class="f" x="324" y="255" font-size="15" font-weight="400" fill="#276749" text-anchor="start">Bien: pita / casi 0 Ω</text><text class="f" x="324" y="278" font-size="15" font-weight="400" fill="#1d4ed8" text-anchor="start">Tienes: tu multímetro</text><rect x="572" y="130" width="250" height="200" rx="10" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="590" y="160" font-size="18" font-weight="700" fill="#c05621" text-anchor="start">3. Toma de tierra</text><text class="f" x="590" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Telurómetro con picas</text><text class="f" x="590" y="209" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">auxiliares, con la pica</text><text class="f" x="590" y="232" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">soltada del borne.</text><text class="f" x="590" y="255" font-size="15" font-weight="400" fill="#276749" text-anchor="start">Bien: menos de 37 Ω</text><text class="f" x="590" y="278" font-size="15" font-weight="400" fill="#553c9a" text-anchor="start">Lo pone tu colega</text><rect x="838" y="130" width="250" height="200" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="856" y="160" font-size="18" font-weight="700" fill="#1d4ed8" text-anchor="start">4. Diferencial</text><text class="f" x="856" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Comprobador de</text><text class="f" x="856" y="209" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">diferenciales a 30 mA</text><text class="f" x="856" y="232" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">en un enchufe.</text><text class="f" x="856" y="255" font-size="15" font-weight="400" fill="#276749" text-anchor="start">Bien: salta en ≤ 300 ms</text><text class="f" x="856" y="278" font-size="15" font-weight="400" fill="#553c9a" text-anchor="start">Lo pone tu colega</text><rect x="1104" y="130" width="250" height="200" rx="10" fill="#e6f6f6" stroke="#2c7a7b" stroke-width="2"/><text class="f" x="1122" y="160" font-size="18" font-weight="700" fill="#285e61" text-anchor="start">5. Tensión</text><text class="f" x="1122" y="186" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Al final, con luz: 230 V</text><text class="f" x="1122" y="209" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">entre fase y neutro y</text><text class="f" x="1122" y="232" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">0 V entre neutro y tierra</text><text class="f" x="1122" y="255" font-size="15" font-weight="400" fill="#276749" text-anchor="start">(aprox.). Polaridad bien.</text><text class="f" x="1122" y="278" font-size="15" font-weight="400" fill="#1d4ed8" text-anchor="start">Tienes: tu multímetro</text><rect x="40" y="360" width="1320" height="170" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="58" y="390" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">Por qué en este orden</text><text class="f" x="58" y="416" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">1 y 2 se hacen sin tensión, con la instalación terminada: si algo da mal, se arregla antes de que i-DE conecte.</text><text class="f" x="58" y="439" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">3 también va antes: sin tierra buena el diferencial no protege a nadie.</text><text class="f" x="58" y="462" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">4 y 5 necesitan luz: se hacen el día que i-DE conecta, o con un suministro provisional si lo hay.</text><text class="f" x="58" y="485" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Apunta cada número en la ficha del trabajo con fecha: es tu prueba de que trabajaste bien.</text></svg>