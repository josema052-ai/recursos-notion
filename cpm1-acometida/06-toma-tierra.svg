<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><defs><marker id="mc05621" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker><marker id="mc05621s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker></defs><rect x="0" y="0" width="1400" height="760" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">La toma de tierra de la casa (esquema TT)</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">ITC-BT-18 y ITC-BT-26 · i-DE pide menos de 37 Ω en edificios sin pararrayos (MT 2.80.12)</text><rect x="40" y="470" width="820" height="260" rx="0" fill="#efe6d8" stroke="#efe6d8" stroke-width="0"/><line x1="50" y1="480" x2="30" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="90" y1="480" x2="70" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="130" y1="480" x2="110" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="170" y1="480" x2="150" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="210" y1="480" x2="190" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="250" y1="480" x2="230" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="290" y1="480" x2="270" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="330" y1="480" x2="310" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="370" y1="480" x2="350" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="410" y1="480" x2="390" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="450" y1="480" x2="430" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="490" y1="480" x2="470" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="530" y1="480" x2="510" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="570" y1="480" x2="550" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="610" y1="480" x2="590" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="650" y1="480" x2="630" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="690" y1="480" x2="670" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="730" y1="480" x2="710" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="770" y1="480" x2="750" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="810" y1="480" x2="790" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="850" y1="480" x2="830" y2="500" stroke="#d8c7ad" stroke-width="1.5"/><line x1="40" y1="470" x2="860" y2="470" stroke="#1f2933" stroke-width="3"/><rect x="560" y="130" width="50" height="340" rx="0" fill="#f3e9e0" stroke="#c8a98b" stroke-width="2"/><text class="f" x="585" y="122" font-size="13" font-weight="700" fill="#5f6b7a" text-anchor="middle">pared de la casa</text><rect x="620" y="170" width="170" height="130" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="2.5"/><text class="f" x="705" y="196" font-size="14" font-weight="700" fill="#1f2933" text-anchor="middle">Cuadro de la casa</text><rect x="636" y="214" width="22" height="50" rx="3" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><rect x="666" y="214" width="22" height="50" rx="3" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><rect x="696" y="214" width="22" height="50" rx="3" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><rect x="726" y="214" width="22" height="50" rx="3" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><rect x="756" y="214" width="22" height="50" rx="3" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/><text class="f" x="705" y="286" font-size="12" font-weight="400" fill="#276749" text-anchor="middle">barra de tierra</text><line x1="810" y1="300" x2="810" y2="468" stroke="#c05621" stroke-width="1.6" marker-end="url(#mc05621)" marker-start="url(#mc05621s)"/><text class="f" x="818" y="390" font-size="14" font-weight="700" fill="#c05621" text-anchor="start">1,4-2 m</text><rect x="640" y="360" width="120" height="44" rx="6" fill="#fff8e1" stroke="#d69e2e" stroke-width="2.5"/><text class="f" x="700" y="388" font-size="13" font-weight="700" fill="#975a16" text-anchor="middle">borne de tierra</text><path d="M705,300 L705,360" stroke="#2f855a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text class="f" x="712" y="335" font-size="12" font-weight="700" fill="#276749" text-anchor="start">línea principal</text><text class="f" x="712" y="350" font-size="12" font-weight="400" fill="#276749" text-anchor="start">Cu 16 mm²</text><path d="M640,382 L420,382 L420,510 L300,510" stroke="#2f855a" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text class="f" x="430" y="372" font-size="12" font-weight="700" fill="#276749" text-anchor="start">conductor de tierra</text><rect x="250" y="464" width="100" height="60" rx="2" fill="#e2e8f0" stroke="#5f6b7a" stroke-width="2"/><text class="f" x="300" y="456" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="middle">arqueta registrable</text><rect x="293" y="510" width="14" height="200" rx="2" fill="#c05621" stroke="#7b341e" stroke-width="1.5"/><line x1="250" y1="510" x2="250" y2="710" stroke="#c05621" stroke-width="1.6" marker-end="url(#mc05621)" marker-start="url(#mc05621s)"/><text class="f" x="242" y="615" font-size="14" font-weight="700" fill="#c05621" text-anchor="end">2 m</text><text class="f" x="318" y="630" font-size="13" font-weight="700" fill="#1f2933" text-anchor="start">pica de acero</text><text class="f" x="318" y="648" font-size="13" font-weight="400" fill="#1f2933" text-anchor="start">cobreado (UNE 202006)</text><rect x="900" y="120" width="460" height="175" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="918" y="150" font-size="17" font-weight="700" fill="#276749" text-anchor="start">Lo que hay que conseguir</text><text class="f" x="918" y="176" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Resistencia de tierra menor de 37 Ω.</text><text class="f" x="918" y="199" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Si no baja: más picas separadas o cable de</text><text class="f" x="918" y="222" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">cobre desnudo enterrado en la zanja.</text><text class="f" x="918" y="245" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Se mide con telurómetro (lo tiene tu colega).</text><rect x="900" y="315" width="460" height="175" rx="10" fill="#fdf0e6" stroke="#dd6b20" stroke-width="2"/><text class="f" x="918" y="345" font-size="17" font-weight="700" fill="#c05621" text-anchor="start">Secciones mínimas</text><text class="f" x="918" y="371" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Línea principal de tierra: cobre 16 mm².</text><text class="f" x="918" y="394" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Cable de tierra enterrado: 16 mm² si va aislado;</text><text class="f" x="918" y="417" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">25 mm² si va de cobre desnudo (ITC-BT-18,</text><text class="f" x="918" y="440" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">tabla 1). Que lo confirme tu colega.</text><rect x="900" y="510" width="460" height="200" rx="10" fill="#fdecec" stroke="#c53030" stroke-width="2"/><text class="f" x="918" y="540" font-size="17" font-weight="700" fill="#c53030" text-anchor="start">Errores que tumban la obra</text><text class="f" x="918" y="566" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Usar tuberías de agua o gas como tierra.</text><text class="f" x="918" y="589" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Unir neutro y tierra en la casa (en TT, nunca).</text><text class="f" x="918" y="612" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Dejar la pica sin arqueta ni borne para medir.</text><text class="f" x="918" y="635" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Diferencial que no salta al probarlo.</text></svg>