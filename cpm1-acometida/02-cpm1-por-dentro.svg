<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><style>.f{font-family:Inter,"Helvetica Neue",Arial,sans-serif}</style><rect x="0" y="0" width="1400" height="900" fill="#ffffff"/><text class="f" x="40" y="52" font-size="30" font-weight="700" fill="#1f2933" text-anchor="start">La CPM1 por dentro (modelo de i-DE CPM1-D2-M, para empotrar)</text><text class="f" x="40" y="84" font-size="17" font-weight="400" fill="#5f6b7a" text-anchor="start">Esquema simplificado: la caja real cambia según el fabricante (Claved, Uriarte, Cahors…). Mira siempre su ficha.</text><rect x="80" y="130" width="460" height="640" rx="14" fill="#e9ecef" stroke="#8a94a3" stroke-width="3"/><rect x="100" y="150" width="420" height="300" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text class="f" x="120" y="176" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="start">Parte de medida</text><rect x="170" y="188" width="240" height="236" rx="10" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 5"/><text class="f" x="418" y="210" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">mirilla</text><rect x="190" y="200" width="200" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><rect x="220" y="220" width="140" height="46" rx="4" fill="#dbe7ff" stroke="#2563eb" stroke-width="1.5"/><text class="f" x="290" y="250" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">0 1 2 3 4 kWh</text><text class="f" x="290" y="296" font-size="18" font-weight="700" fill="#1f2933" text-anchor="middle">Contador</text><text class="f" x="290" y="317" font-size="14" font-weight="400" fill="#1f2933" text-anchor="middle">monofásico (de i-DE)</text><text class="f" x="225" y="366" font-size="12" font-weight="700" fill="#8b4513" text-anchor="middle">entra</text><rect x="213" y="376" width="24" height="22" rx="3" fill="#e9ecef" stroke="#5f6b7a" stroke-width="1.5"/><text class="f" x="270" y="366" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">entra</text><rect x="258" y="376" width="24" height="22" rx="3" fill="#e9ecef" stroke="#5f6b7a" stroke-width="1.5"/><text class="f" x="315" y="366" font-size="12" font-weight="700" fill="#8b4513" text-anchor="middle">sale</text><rect x="303" y="376" width="24" height="22" rx="3" fill="#e9ecef" stroke="#5f6b7a" stroke-width="1.5"/><text class="f" x="360" y="366" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">sale</text><rect x="348" y="376" width="24" height="22" rx="3" fill="#e9ecef" stroke="#5f6b7a" stroke-width="1.5"/><line x1="90" y1="475" x2="530" y2="475" stroke="#6b46c1" stroke-width="3" stroke-dasharray="10 6"/><text class="f" x="550" y="472" font-size="13" font-weight="700" fill="#553c9a" text-anchor="start">pantalla</text><text class="f" x="550" y="488" font-size="13" font-weight="700" fill="#553c9a" text-anchor="start">precintable</text><rect x="100" y="515" width="420" height="235" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/><text class="f" x="300.0" y="736" font-size="15" font-weight="700" fill="#5f6b7a" text-anchor="middle">Parte de protección</text><rect x="170" y="560" width="70" height="150" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="2.5"/><rect x="185" y="590" width="40" height="90" rx="4" fill="#fdecec" stroke="#c53030" stroke-width="2"/><text class="f" x="205" y="640" font-size="15" font-weight="700" fill="#c53030" text-anchor="middle">gG</text><text class="f" x="260" y="630" font-size="13" font-weight="700" fill="#c53030" text-anchor="start">Fusible</text><text class="f" x="260" y="646" font-size="13" font-weight="400" fill="#c53030" text-anchor="start">(en la fase)</text><rect x="380" y="560" width="70" height="150" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><rect x="402" y="605" width="26" height="60" rx="4" fill="#dbe7ff" stroke="#2563eb" stroke-width="2"/><text class="f" x="460" y="630" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">Neutro</text><text class="f" x="460" y="646" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="start">seccionable</text><path d="M205,840 L205,710" stroke="#8b4513" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M415,840 L415,710" stroke="#2563eb" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text class="f" x="310.0" y="868" font-size="15" font-weight="700" fill="#1f2933" text-anchor="middle">Acometida de i-DE (fase + neutro): entra por abajo</text><path d="M205,560 L205,460 L225,460 L225,398" stroke="#8b4513" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M415,560 L415,460 L270,460 L270,398" stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M315,398 L315,430 L650,430" stroke="#8b4513" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M360,398 L360,442 L650,442" stroke="#2563eb" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text class="f" x="550" y="400" font-size="13" font-weight="700" fill="#276749" text-anchor="start">Derivación</text><text class="f" x="550" y="416" font-size="13" font-weight="700" fill="#276749" text-anchor="start">individual →</text><line x1="550" y1="790" x2="590" y2="790" stroke="#8b4513" stroke-width="4"/><text class="f" x="598" y="795" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">fase</text><line x1="550" y1="816" x2="590" y2="816" stroke="#2563eb" stroke-width="4"/><text class="f" x="598" y="821" font-size="14" font-weight="400" fill="#1f2933" text-anchor="start">neutro</text><rect x="700" y="120" width="660" height="102" rx="10" fill="#e8f0fe" stroke="#2563eb" stroke-width="2"/><text class="f" x="718" y="150" font-size="17" font-weight="700" fill="#1d4ed8" text-anchor="start">Contador (de i-DE)</text><text class="f" x="718" y="176" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Lo pone y lo precinta i-DE. Con telegestión, lo lee</text><text class="f" x="718" y="199" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">a distancia y hace de limitador de potencia (ICP).</text><rect x="700" y="238" width="660" height="125" rx="10" fill="#fdecec" stroke="#c53030" stroke-width="2"/><text class="f" x="718" y="268" font-size="17" font-weight="700" fill="#c53030" text-anchor="start">Fusible de la CPM1</text><text class="f" x="718" y="294" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Protege el cable de la derivación individual. i-DE pide</text><text class="f" x="718" y="317" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">fusible gG con un mínimo de 63 A (MT 2.80.12).</text><text class="f" x="718" y="340" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Lo monta el instalador y luego i-DE lo precinta.</text><rect x="700" y="379" width="660" height="125" rx="10" fill="#f4f6f8" stroke="#c9d1db" stroke-width="2"/><text class="f" x="718" y="409" font-size="17" font-weight="700" fill="#1f2933" text-anchor="start">Neutro seccionable</text><text class="f" x="718" y="435" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Pieza que abre el neutro con herramienta, para aislar</text><text class="f" x="718" y="458" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">y medir. En la casa (esquema TT) el neutro nunca</text><text class="f" x="718" y="481" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">se une a la tierra.</text><rect x="700" y="520" width="660" height="125" rx="10" fill="#f3ecfd" stroke="#6b46c1" stroke-width="2"/><text class="f" x="718" y="550" font-size="17" font-weight="700" fill="#553c9a" text-anchor="start">La caja</text><text class="f" x="718" y="576" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Poliéster con fibra de vidrio. Instalada: IP43 e IK09</text><text class="f" x="718" y="599" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">(ITC-BT-13). Tiene que ser un modelo aceptado por</text><text class="f" x="718" y="622" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">i-DE (norma NI 42.72.00). Para nicho: CPM1-D2-M.</text><rect x="700" y="661" width="660" height="125" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="2"/><text class="f" x="718" y="691" font-size="17" font-weight="700" fill="#276749" text-anchor="start">Ejemplo real de catálogo</text><text class="f" x="718" y="717" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">Claved CD-CPM1-D2-M · código i-DE 4272001</text><text class="f" x="718" y="740" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">460 × 330 × 190 mm · base de fusible BUC tamaño 00</text><text class="f" x="718" y="763" font-size="15" font-weight="400" fill="#1f2933" text-anchor="start">(hasta 160 A) · neutro seccionable · mirilla</text></svg>